      function modeIconName(mode) {
        if (mode === "spawn") return "spawn";
        if (mode === "user") return "user";
        if (mode === "internal") return "process";
        return "a2a";
      }

      function formatTime(ts) {
        return new Date(ts).toLocaleTimeString();
      }

      function formatDateTime(ts) {
        return new Date(ts).toLocaleString("zh-CN", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        });
      }

      function formatFileTimestamp(ts) {
        const date = new Date(Number(ts) || Date.now());
        const year = String(date.getFullYear());
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        const hour = String(date.getHours()).padStart(2, "0");
        const minute = String(date.getMinutes()).padStart(2, "0");
        const second = String(date.getSeconds()).padStart(2, "0");
        return `${year}${month}${day}-${hour}${minute}${second}`;
      }

      function formatDayKey(ts) {
        const date = new Date(Number(ts) || Date.now());
        const year = String(date.getFullYear());
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function formatDayLabel(dayKey) {
        const date = new Date(`${dayKey}T00:00:00`);
        if (Number.isNaN(date.getTime())) return dayKey;
        return date.toLocaleDateString("zh-CN", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          weekday: "short"
        });
      }

      function formatHourLabel(hour) {
        const safe = clamp(Math.round(Number(hour) || 0), 0, 24);
        return `${String(safe).padStart(2, "0")}:00`;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function sanitizeHref(rawHref) {
        const href = String(rawHref ?? "").trim();
        if (!href) return "";
        if (/^(https?:|mailto:)/i.test(href)) return href;
        if (href.startsWith("/") || href.startsWith("#")) return href;
        return "";
      }

      function renderInlineMarkdown(text) {
        const placeholders = [];
        const stash = (html) => {
          const token = `\u0000${placeholders.length}\u0000`;
          placeholders.push(html);
          return token;
        };

        let html = escapeHtml(String(text ?? ""));

        html = html.replace(/`([^`\n]+)`/g, (_, code) => {
          return stash(`<code>${code}</code>`);
        });

        html = html.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+\"([^\"]*)\")?\)/g, (_, label, href, title) => {
          const safeHref = sanitizeHref(href);
          if (!safeHref) return label;
          const titleAttr = title ? ` title="${escapeHtml(title)}"` : "";
          return stash(`<a href="${escapeHtml(safeHref)}"${titleAttr} target="_blank" rel="noreferrer noopener">${label}</a>`);
        });

        html = html.replace(/\*\*([^*][\s\S]*?)\*\*/g, "<strong>$1</strong>");
        html = html.replace(/(^|[^\*])\*([^*\n][\s\S]*?)\*(?!\*)/g, "$1<em>$2</em>");
        html = html.replace(/(^|[^_])_([^_\n][\s\S]*?)_(?!_)/g, "$1<em>$2</em>");
        html = html.replace(/~~([^~][\s\S]*?)~~/g, "<del>$1</del>");
        html = html.replace(/\n/g, "<br>");

        return html.replace(/\u0000(\d+)\u0000/g, (_, index) => placeholders[Number(index)] || "");
      }

      function renderMarkdown(text) {
        const source = String(text ?? "").replace(/\r\n?/g, "\n");
        if (!source.trim()) return `<p>${escapeHtml("(空消息)")}</p>`;

        const lines = source.split("\n");
        const blocks = [];

        const isHorizontalRule = (line) => /^\s*([-*_])(?:\s*\1){2,}\s*$/.test(line);
        const isHeading = (line) => /^(#{1,6})\s+(.*)$/.test(line);
        const isQuote = (line) => /^\s*>\s?/.test(line);
        const isUnorderedItem = (line) => /^\s*[-+*]\s+/.test(line);
        const isOrderedItem = (line) => /^\s*\d+\.\s+/.test(line);
        const isFence = (line) => /^\s*```/.test(line);
        const isBlockBoundary = (line) => {
          if (!line.trim()) return true;
          return isHorizontalRule(line) || isHeading(line) || isQuote(line) || isUnorderedItem(line) || isOrderedItem(line) || isFence(line);
        };

        let index = 0;
        while (index < lines.length) {
          const line = lines[index];

          if (!line.trim()) {
            index += 1;
            continue;
          }

          const fenceMatch = /^\s*```([\w-]*)\s*$/.exec(line);
          if (fenceMatch) {
            const codeLines = [];
            index += 1;
            while (index < lines.length && !/^\s*```\s*$/.test(lines[index])) {
              codeLines.push(lines[index]);
              index += 1;
            }
            if (index < lines.length) index += 1;
            blocks.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
            continue;
          }

          const headingMatch = /^(#{1,6})\s+(.*)$/.exec(line);
          if (headingMatch) {
            const level = Math.min(6, headingMatch[1].length);
            blocks.push(`<h${level}>${renderInlineMarkdown(headingMatch[2].trim())}</h${level}>`);
            index += 1;
            continue;
          }

          if (isHorizontalRule(line)) {
            blocks.push("<hr />");
            index += 1;
            continue;
          }

          if (isQuote(line)) {
            const quoteLines = [];
            while (index < lines.length && isQuote(lines[index])) {
              quoteLines.push(lines[index].replace(/^\s*>\s?/, ""));
              index += 1;
            }
            blocks.push(`<blockquote>${renderInlineMarkdown(quoteLines.join("\n"))}</blockquote>`);
            continue;
          }

          if (isUnorderedItem(line)) {
            const items = [];
            while (index < lines.length && isUnorderedItem(lines[index])) {
              items.push(lines[index].replace(/^\s*[-+*]\s+/, ""));
              index += 1;
            }
            blocks.push(`<ul>${items.map((item) => `<li>${renderInlineMarkdown(item)}</li>`).join("")}</ul>`);
            continue;
          }

          if (isOrderedItem(line)) {
            const items = [];
            while (index < lines.length && isOrderedItem(lines[index])) {
              items.push(lines[index].replace(/^\s*\d+\.\s+/, ""));
              index += 1;
            }
            blocks.push(`<ol>${items.map((item) => `<li>${renderInlineMarkdown(item)}</li>`).join("")}</ol>`);
            continue;
          }

          const paragraphLines = [];
          while (index < lines.length && !isBlockBoundary(lines[index])) {
            paragraphLines.push(lines[index]);
            index += 1;
          }
          blocks.push(`<p>${renderInlineMarkdown(paragraphLines.join("\n"))}</p>`);
        }

        return blocks.join("");
      }

      function measureTextWidth(text, font = BASE_TEXT_FONT) {
        const previousFont = measureCtx.font;
        if (font && previousFont !== font) measureCtx.font = font;
        const width = measureCtx.measureText(String(text || "")).width;
        if (font && previousFont !== font) measureCtx.font = previousFont;
        return width;
      }

      function buildAgentList(events) {
        const agents = [];

        const addAgent = (agentId) => {
          if (!agentId || agents.includes(agentId)) return;
          if (agentId === "user") {
            agents.unshift(agentId);
            return;
          }
          if (agentId === "main") {
            const idx = agents.includes("user") ? 1 : 0;
            agents.splice(idx, 0, agentId);
            return;
          }
          agents.push(agentId);
        };

        events.forEach((evt) => {
          addAgent(evt.from);
          addAgent(evt.to);
        });

        return agents.length ? agents : ["main"];
      }

      function eventMatchesCurrentFilter(evt) {
        if (!evt) return false;
        if (state.sessionFilter === "all") return true;
        if (state.sessionFilter.startsWith("session:")) {
          return evt.sessionTag === state.sessionFilter.slice("session:".length);
        }
        if (state.sessionFilter.startsWith("day:")) {
          return formatDayKey(evt.ts) === state.sessionFilter.slice("day:".length);
        }
        return true;
      }

      function isThinkingEvent(evt) {
        if (!evt || evt.mode !== "internal") return false;
        const mechanism = typeof evt.mechanism === "string" ? evt.mechanism.trim().toLowerCase() : "";
        return evt.stage === "thinking" || mechanism.includes("thinking");
      }

      function getSessionFilterTimeline() {
        return state.allTimeline.filter((evt) => eventMatchesCurrentFilter(evt));
      }

      function getTimeFilterRange() {
        const startHour = clamp(Math.round(Number(state.timeStartHour) || 0), 0, 23);
        const endHour = clamp(Math.round(Number(state.timeEndHour) || 24), startHour + 1, 24);
        return { startHour, endHour };
      }

      function eventMatchesTimeFilter(evt, range = getTimeFilterRange()) {
        if (!evt) return false;
        const date = new Date(Number(evt.ts) || Date.now());
        const clockHour = date.getHours() + date.getMinutes() / 60 + date.getSeconds() / 3600 + date.getMilliseconds() / 3600000;
        return clockHour >= range.startHour && clockHour < range.endHour;
      }

      function getCurrentFilterTimeline() {
        const sessionTimeline = getSessionFilterTimeline();
        const timeRange = getTimeFilterRange();
        return sessionTimeline.filter((evt) => eventMatchesTimeFilter(evt, timeRange));
      }

      function getTimeFilterLabel(range = getTimeFilterRange()) {
        return `${formatHourLabel(range.startHour)} - ${formatHourLabel(range.endHour)}`;
      }

      function getTimeFilterRangeLabel() {
        return `按本地绝对时间筛选，范围覆盖 ${getTimeFilterLabel()}`;
      }

      function getFilteredTimeline() {
        return getCurrentFilterTimeline();
      }

      function findTimelineEvent(eventId) {
        return state.allTimeline.find((evt) => evt.id === eventId) || null;
      }

      function isEventCollapsed(evt) {
        if (!evt) return false;
        if (isThinkingEvent(evt)) {
          if (state.showInternal) {
            return state.collapsedEventIds.has(evt.id);
          }
          return !state.expandedThinkingIds.has(evt.id);
        }
        return state.collapsedEventIds.has(evt.id);
      }

      function resetEventCollapseState() {
        if (state.expandedThinkingIds.size) state.expandedThinkingIds.clear();
        if (!state.collapsedEventIds.size) return;
        state.collapsedEventIds.forEach((id) => {
          const evt = findTimelineEvent(id);
          if (evt && isThinkingEvent(evt)) {
            state.collapsedEventIds.delete(id);
          }
        });
      }

      function pruneEventCollapseState() {
        if (!state.collapsedEventIds.size && !state.expandedThinkingIds.size) return;
        const validIds = new Set(state.allTimeline.map((evt) => evt.id));
        state.collapsedEventIds.forEach((id) => {
          if (!validIds.has(id)) state.collapsedEventIds.delete(id);
        });
        state.expandedThinkingIds.forEach((id) => {
          if (!validIds.has(id)) state.expandedThinkingIds.delete(id);
        });
      }

      function toggleEventCollapsed(eventId) {
        const targetId = typeof eventId === "string" ? eventId.trim() : "";
        if (!targetId) return;

        const evt = findTimelineEvent(targetId);
        if (!evt) return;

        if (isThinkingEvent(evt)) {
          if (state.showInternal) {
            if (state.collapsedEventIds.has(targetId)) {
              state.collapsedEventIds.delete(targetId);
            } else {
              state.collapsedEventIds.add(targetId);
            }
          } else if (state.expandedThinkingIds.has(targetId)) {
            state.expandedThinkingIds.delete(targetId);
          } else {
            state.expandedThinkingIds.add(targetId);
          }
        } else if (state.collapsedEventIds.has(targetId)) {
          state.collapsedEventIds.delete(targetId);
        } else {
          state.collapsedEventIds.add(targetId);
        }

        render({ preserveScroll: true });
      }

      function getSessionFilterLabel() {
        const option = sessionFilterEl.selectedOptions && sessionFilterEl.selectedOptions[0];
        const label = option && typeof option.textContent === "string" ? option.textContent.trim() : "";
        return label || "全部会话";
      }

      function syncSessionFilterOptions() {
        const previous = state.sessionFilter;
        const sessions = [];
        const sessionSeen = new Set();
        const days = [];
        const daySeen = new Set();

        [...state.allTimeline]
          .sort((a, b) => b.ts - a.ts)
          .forEach((evt) => {
            if (evt.sessionTag && !sessionSeen.has(evt.sessionTag)) {
              sessionSeen.add(evt.sessionTag);
              sessions.push({
                value: `session:${evt.sessionTag}`,
                label: `${displayAgent(evt.sessionAgent || parseAgentFromSessionTag(evt.sessionTag) || "unknown")} · ${evt.sessionTag}`
              });
            }

            const dayKey = formatDayKey(evt.ts);
            if (!daySeen.has(dayKey)) {
              daySeen.add(dayKey);
              days.push({
                value: `day:${dayKey}`,
                label: formatDayLabel(dayKey)
              });
            }
          });

        const options = [{ value: "all" }, ...sessions, ...days];
        const hasPrevious = options.some((item) => item.value === previous);
        const latestSessionValue = sessions.length ? sessions[0].value : "all";

        if (!state.sessionFilterTouched) {
          if (sessions.length && (previous === "all" || !hasPrevious)) {
            state.sessionFilter = latestSessionValue;
          } else if (!hasPrevious) {
            state.sessionFilter = "all";
          }
        } else if (!hasPrevious) {
          state.sessionFilter = latestSessionValue;
        }

        sessionFilterEl.textContent = "";

        const allOption = document.createElement("option");
        allOption.value = "all";
        allOption.textContent = "全部会话";
        sessionFilterEl.appendChild(allOption);

        if (sessions.length) {
          const sessionGroup = document.createElement("optgroup");
          sessionGroup.label = "单个会话";
          sessions.forEach((item) => {
            const option = document.createElement("option");
            option.value = item.value;
            option.textContent = item.label;
            sessionGroup.appendChild(option);
          });
          sessionFilterEl.appendChild(sessionGroup);
        }

        if (days.length) {
          const dayGroup = document.createElement("optgroup");
          dayGroup.label = "按天";
          days.forEach((item) => {
            const option = document.createElement("option");
            option.value = item.value;
            option.textContent = item.label;
            dayGroup.appendChild(option);
          });
          sessionFilterEl.appendChild(dayGroup);
        }

        sessionFilterEl.value = state.sessionFilter;
      }

      function wrapText(text, maxWidth, maxLines, font = BASE_TEXT_FONT) {
        const lines = [];
        const parts = String(text || "").split(/\r?\n/);

        for (let p = 0; p < parts.length; p += 1) {
          const part = parts[p];
          if (!part) {
            if (lines.length < maxLines) lines.push("");
            if (lines.length >= maxLines) break;
            continue;
          }

          let line = "";
          for (const ch of part) {
            const next = line + ch;
            if (measureTextWidth(next, font) <= maxWidth || line.length === 0) {
              line = next;
            } else {
              lines.push(line);
              line = ch;
              if (lines.length >= maxLines) break;
            }
          }

          if (lines.length >= maxLines) break;
          if (line) lines.push(line);
          if (lines.length >= maxLines) break;
        }

        if (!lines.length) lines.push("(空)");
        if (lines.length > maxLines) lines.length = maxLines;
        return lines;
      }

      function fitText(text, maxWidth, font = BASE_TEXT_FONT) {
        const raw = String(text || "").trim();
        if (!raw) return "";
        if (!(maxWidth > 12) || measureTextWidth(raw, font) <= maxWidth) return raw;
        const ellipsis = "…";
        const ellipsisW = measureTextWidth(ellipsis, font);
        let out = "";
        for (const ch of raw) {
          const next = out + ch;
          if (measureTextWidth(next, font) + ellipsisW > maxWidth) break;
          out = next;
        }
        return out ? `${out}${ellipsis}` : ellipsis;
      }

      function withEllipsis(text, maxWidth, font = BASE_TEXT_FONT) {
        const clean = String(text || "").replace(/…+$/, "").trimEnd();
        if (!clean) return "…";
        if (measureTextWidth(`${clean}…`, font) <= maxWidth) return `${clean}…`;
        const fitted = fitText(clean, maxWidth, font);
        return fitted.endsWith("…") ? fitted : `${fitted}…`;
      }

      function wrapTextWithEllipsis(text, maxWidth, maxLines, font = BASE_TEXT_FONT) {
        const source = String(text || "");
        if (!source.trim()) return { lines: ["(空)"], truncated: false };

        const parts = source.split(/\r?\n/);
        const lines = [];
        let truncated = false;
        let stop = false;

        for (let p = 0; p < parts.length && !stop; p += 1) {
          const part = parts[p];
          if (!part) {
            if (lines.length < maxLines) {
              lines.push("");
            } else {
              truncated = true;
              break;
            }
            continue;
          }

          let line = "";
          for (let idx = 0; idx < part.length; idx += 1) {
            const ch = part[idx];
            const next = line + ch;
            if (measureTextWidth(next, font) <= maxWidth || !line) {
              line = next;
            } else {
              lines.push(line);
              line = ch;
              if (lines.length >= maxLines) {
                truncated = true;
                stop = true;
                break;
              }
            }
          }

          if (stop) break;

          if (line) {
            lines.push(line);
            if (lines.length > maxLines) {
              lines.length = maxLines;
              truncated = true;
              break;
            }
          }

          if (lines.length >= maxLines && p < parts.length - 1) {
            truncated = true;
            break;
          }
        }

        if (!lines.length) lines.push("(空)");

        if (truncated) {
          const lastIndex = Math.min(lines.length, maxLines) - 1;
          lines[lastIndex] = withEllipsis(lines[lastIndex], maxWidth, font);
        }

        return {
          lines: lines.slice(0, maxLines),
          truncated
        };
      }

      function mechanismIconName(mechanism) {
        const clean = typeof mechanism === "string" ? mechanism.trim().toLowerCase() : "";
        if (!clean) return "process";
        if (clean === "sessions_spawn") return "spawn";
        if (clean === "sessions_send") return "send";
        if (clean.includes("thinking") || clean === "process") return "spark";
        if (clean.includes("read")) return "doc";
        if (clean.includes("write") || clean.includes("edit")) return "edit";
        if (clean.includes("grep") || clean.includes("search")) return "search";
        if (clean.includes("fetch") || clean.includes("browser")) return "globe";
        if (clean.includes("exec") || clean.includes("shell") || clean.includes("bash") || clean.includes("terminal")) return "terminal";
        if (clean.includes("cron") || clean.includes("schedule")) return "clock";
        if (clean.includes("message")) return "message";
        if (clean.includes("gateway")) return "send";
        return "process";
      }

      function eventVisualIconName(evt) {
        if (!evt) return "";
        const text = String(evt.text || "");
        const hasError = /error|failed|exception|denied|timeout|失败|异常|拒绝/i.test(text);
        if (hasError) return "warning";

        if (evt.mode === "user") {
          return "message";
        }

        if (evt.mode === "spawn") {
          if (evt.stage === "result") return "check";
          if (evt.stage === "delivery") return "inbox";
          return "spawn";
        }

        if (evt.mode === "a2a") {
          if (evt.stage === "result") return "check";
          if (evt.stage === "delivery") return "inbox";
          return "send";
        }

        if (evt.mode === "internal") {
          if (evt.stage === "thinking") return "spark";
          return mechanismIconName(evt.mechanism);
        }

        return mechanismIconName(evt.mechanism);
      }

      function decorateEventText(evt) {
        return String((evt && evt.text) || "").trim() || "(空消息)";
      }

      function extractDisplayTitle(evt) {
        const raw = String((evt && evt.text) || "").trim();
        if (!raw) return { title: "", body: "(空消息)" };
        const lines = raw.split(/\r?\n/);
        const titleMatch = /^【\s*([^】]+?)\s*】$/.exec(lines[0] || "");
        if (!titleMatch) {
          return {
            title: "",
            body: decorateEventText(evt)
          };
        }

        const titleCore = titleMatch[1].trim();
        const body = lines.slice(1).join("\n").trim() || "(空消息)";
        return {
          title: titleCore,
          body
        };
      }

      function mechanismLabel(evt) {
        if (!evt || typeof evt.mechanism !== "string") return "";
        if (!evt.mechanism.startsWith("sessions_")) return "";
        const text = evt.stage ? `${evt.mechanism} (${evt.stage})` : `${evt.mechanism}`;
        return fitText(text, 156);
      }

      function detailMechanismLabel(evt) {
        if (!evt || typeof evt.mechanism !== "string") return "";
        const mechanism = evt.mechanism.trim();
        if (!mechanism || mechanism === "user_message") return "";
        if (!evt.stage || evt.stage === mechanism) return mechanism;
        return `${mechanism} (${evt.stage})`;
      }

      function detailTitleText(evt) {
        const displayParts = extractDisplayTitle(evt);
        if (displayParts.title) return displayParts.title;

        const mechanism = detailMechanismLabel(evt);
        if (mechanism) return mechanism;

        if (evt.mode === "user" && evt.from !== "user") {
          return "回复消息";
        }

        return modeSpec(evt).titleLabel;
      }

      function buildDetailTags(evt) {
        const tags = [
          { text: formatDateTime(evt.ts), icon: "clock" },
          {
            text: modeSpec(evt).titleLabel,
            icon: modeIconName(evt.mode),
            accent: modeColor[evt.mode] || "",
            title: modeSpec(evt).description
          }
        ];

        const mechanism = detailMechanismLabel(evt);
        if (mechanism) {
          tags.push({
            text: mechanism,
            icon: mechanismIconName(evt.mechanism)
          });
        }

        if (evt.sessionTag) {
          tags.push({
            text: evt.sessionTag,
            icon: "thread"
          });
        }

        return tags;
      }

      function createDetailTag(def) {
        const tag = document.createElement("span");
        tag.className = "detail-tag";
        tag.title = def.title || def.text;

        if (def.accent) {
          tag.classList.add("detail-tag--accent");
          tag.style.setProperty("--tag-accent", def.accent);
          tag.style.borderColor = def.accent;
          tag.style.color = def.accent;
        }

        if (def.icon) {
          const iconWrap = document.createElement("span");
          iconWrap.className = "detail-tag__icon";
          iconWrap.appendChild(createHtmlIcon(def.icon, { size: 14 }));
          tag.appendChild(iconWrap);
        }

        const text = document.createElement("span");
        text.className = "detail-tag__text";
        text.textContent = def.text;
        tag.appendChild(text);
        return tag;
      }

      function getVisibleSelectedEvent(visible) {
        if (!state.selectedEventId) return null;
        return visible.find((evt) => evt.id === state.selectedEventId) || null;
      }

      function renderDetailPanel(visible) {
        const selected = getVisibleSelectedEvent(visible);
        if (!selected) {
          state.selectedEventId = null;
          boardShell.classList.add("is-detail-collapsed");
          detailPanel.classList.add("is-empty");
          detailPanel.classList.add("is-collapsed");
          detailPanel.dataset.eventId = "";
          detailPanel.setAttribute("aria-hidden", "true");
          detailTitleEl.textContent = "未选择事件";
          detailSubtitleEl.textContent = "点击任意事件卡片，在这里查看完整正文并进行复制。";
          detailTagsEl.textContent = "";
          detailBodyEl.innerHTML = "";
          detailCopyBtn.disabled = true;
          detailClearBtn.disabled = true;
          detailCopyBtn.dataset.copyText = "";
          return;
        }

        const previousEventId = detailPanel.dataset.eventId || "";
        boardShell.classList.remove("is-detail-collapsed");
        detailPanel.classList.remove("is-empty");
        detailPanel.classList.remove("is-collapsed");
        detailPanel.dataset.eventId = selected.id;
        detailPanel.setAttribute("aria-hidden", "false");
        detailTitleEl.textContent = detailTitleText(selected);
        detailSubtitleEl.textContent = `${displayAgent(selected.from)} → ${displayAgent(selected.to)} · ${modeSpec(selected).description}`;
        detailTagsEl.textContent = "";
        buildDetailTags(selected).forEach((tagDef) => {
          detailTagsEl.appendChild(createDetailTag(tagDef));
        });
        detailBodyEl.innerHTML = renderMarkdown(selected.text);
        detailCopyBtn.disabled = false;
        detailClearBtn.disabled = false;
        detailCopyBtn.dataset.copyText = selected.text;

        if (previousEventId !== selected.id) {
          detailContentEl.scrollTop = 0;
        }
      }

      function buildMetaChipLayout(evt, maxWidth) {
        const chipMaxWidth = Math.max(96, Math.min(220, Math.floor(maxWidth * 0.82)));
        const chips = [
          { text: formatTime(evt.ts), icon: "clock" },
          {
            text: modeName(evt),
            icon: modeIconName(evt.mode),
            accent: modeColor[evt.mode] || "",
            title: modeSpec(evt).description
          }
        ].map((chip) => {
          const iconWidth = chip.icon ? 18 : 0;
          const fittedText = fitText(chip.text, chipMaxWidth - 22 - iconWidth);
          return {
            ...chip,
            text: fittedText,
            width: clamp(Math.ceil(measureTextWidth(fittedText) + 22 + iconWidth), 74, chipMaxWidth)
          };
        });

        const rows = [];
        let current = [];
        let currentWidth = 0;

        chips.forEach((chip) => {
          const nextWidth = current.length ? currentWidth + 8 + chip.width : chip.width;
          if (current.length && nextWidth > maxWidth) {
            rows.push({ chips: current, width: currentWidth });
            current = [chip];
            currentWidth = chip.width;
            return;
          }
          current.push(chip);
          currentWidth = nextWidth;
        });

        if (current.length) rows.push({ chips: current, width: currentWidth });

        return {
          rows,
          width: rows.length ? Math.max(...rows.map((row) => row.width)) : 0,
          height: rows.length ? rows.length * 22 + (rows.length - 1) * 8 : 0
        };
      }

      function buildEventMetrics(evt, y, labelMaxW, totalLines) {
        const collapsed = isEventCollapsed(evt);
        const metaText = `${formatTime(evt.ts)} · ${modeName(evt)} · ${displayAgent(evt.from)} → ${displayAgent(evt.to)}`;
        const toggleText = collapsed ? "展开" : "收起";
        const toggleW = clamp(Math.ceil(measureTextWidth(toggleText) + 26), 58, 74);
        const visualIconName = eventVisualIconName(evt);

        if (collapsed) {
          const compactTitle = fitText(detailTitleText(evt) || modeName(evt), labelMaxW - 118);
          const compactTime = formatTime(evt.ts);
          const titleW = measureTextWidth(compactTitle);
          const timeW = measureTextWidth(compactTime);
          const iconW = visualIconName ? 16 : 0;
          const boxW = clamp(Math.ceil(iconW + titleW + timeW + toggleW + 48), 154, Math.min(labelMaxW, 320));
          const boxH = 36;
          return {
            evt,
            collapsed: true,
            compactTitle,
            compactTime,
            bodyIconName: visualIconName,
            toggleText,
            toggleW,
            y,
            textH: boxH,
            arrowY: y + boxH + 9,
            h: boxH + 24,
            boxW,
            metaText
          };
        }

        const displayParts = extractDisplayTitle(evt);
        const metaChipLayout = buildMetaChipLayout(evt, labelMaxW - 18);
        const titleIconName = displayParts.title ? eventVisualIconName(evt) : "";
        const bodyIconName = displayParts.title ? "" : eventVisualIconName(evt);
        const bodyIconWidth = bodyIconName ? 18 : 0;
        const gapAfterMeta = displayParts.title ? 12 : 14;
        const shortBody =
          displayParts.body.length > 320 ? `${displayParts.body.slice(0, 317)}...` : displayParts.body;
        const bodyLines = wrapText(shortBody, labelMaxW - 18 - bodyIconWidth, Math.max(2, totalLines - (displayParts.title ? 1 : 0)));
        const titleText = displayParts.title ? fitText(displayParts.title, labelMaxW - 26 - (titleIconName ? 18 : 0)) : "";
        const titleW = titleText ? clamp(Math.ceil(measureTextWidth(titleText) + 18 + (titleIconName ? 18 : 0)), 74, labelMaxW - 18) : 0;
        const bodyBlockH = bodyLines.length * 15;
        const titleBlockH = titleText ? 34 : 0;
        const toggleBlockH = 22;
        const toggleGap = 10;
        const textH = 10 + metaChipLayout.height + gapAfterMeta + titleBlockH + bodyBlockH + toggleGap + toggleBlockH + 12;
        const arrowY = y + textH + 9;
        const rowH = textH + 24;
        const measuredLineW = Math.max(
          metaChipLayout.width,
          ...bodyLines.map((line) => measureTextWidth(line) + bodyIconWidth),
          titleText ? titleW - 18 : 0,
          toggleW
        );
        const boxW = clamp(Math.ceil(measuredLineW + 22), 170, labelMaxW);
        return {
          evt,
          collapsed,
          metaChipLayout,
          titleText,
          titleIconName,
          titleW,
          bodyIconName,
          gapAfterMeta,
          bodyLines,
          toggleText,
          toggleW,
          y,
          textH,
          arrowY,
          h: rowH,
          boxW,
          metaText
        };
      }

      function isParallelSpawnSeed(evt) {
        return Boolean(
          evt &&
          evt.mode === "spawn" &&
          evt.from === "main" &&
          evt.mechanism === "sessions_spawn" &&
          evt.stage === "call"
        );
      }

      function selectEvent(eventId) {
        const nextId = typeof eventId === "string" && eventId ? eventId : null;
        if (state.selectedEventId === nextId) return;
        state.selectedEventId = nextId;
        render({ preserveScroll: true });
      }

      function collapseSidePanels() {
        const needsSidebarCollapse = !state.sidebarCollapsed;
        const needsDetailCollapse = Boolean(state.selectedEventId);
        if (!needsSidebarCollapse && !needsDetailCollapse) return;

        state.sidebarCollapsed = true;
        state.selectedEventId = null;
        writeStorage(SIDEBAR_STORAGE_KEY, "1");
        syncShellState();
        scheduleRelayout();
      }

      function isBlankBoardClickTarget(target) {
        if (!(target instanceof Element)) return false;
        if (target.closest('[role="button"], button, a, input, select, textarea, label, summary')) return false;
        if (target.closest("#detail-panel, .sidebar, .copy-toast")) return false;
        return Boolean(target.closest("#diagram, #diagram-header, #diagram-header-svg"));
      }

      async function copyEventText(text) {
        const value = String(text || "").trim();
        if (!value) return;

        try {
          if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
            await navigator.clipboard.writeText(value);
          } else {
            const input = document.createElement("textarea");
            input.value = value;
            input.setAttribute("readonly", "true");
            input.style.position = "fixed";
            input.style.top = "-9999px";
            document.body.appendChild(input);
            input.select();
            document.execCommand("copy");
            document.body.removeChild(input);
          }
          showCopyToast("已复制全文");
        } catch {
          showCopyToast("复制失败");
        }
      }

      function showCopyToast(text) {
        copyToast.textContent = text;
        copyToast.style.display = "block";
        if (copyToastTimer) clearTimeout(copyToastTimer);
        copyToastTimer = setTimeout(() => {
          copyToast.style.display = "none";
          copyToastTimer = null;
        }, 1500);
      }

      function clamp(num, min, max) {
        return Math.max(min, Math.min(max, num));
      }

      function addEvent(evt, renderNow = true) {
        if (!evt || state.idSet.has(evt.id)) return false;
        state.idSet.add(evt.id);

        const previousTotal = getFilteredTimeline().length;
        const atTail = state.cursor >= previousTotal;

        state.allTimeline.push(evt);
        syncSessionFilterOptions();

        if (atTail) {
          const nextTotal = getFilteredTimeline().length;
          state.cursor = nextTotal;
          if (nextTotal > previousTotal) {
            state.forceBottom = true;
          }
        }

        if (renderNow) render();
        return true;
      }

      function rebuildFromHistory(items) {
        state.allTimeline.length = 0;
        state.idSet.clear();

        const sorted = [...items].sort((a, b) => (Number(a.ts) || 0) - (Number(b.ts) || 0));
        sorted.forEach((raw) => {
          const evt = normalizeEvent(raw);
          if (!evt || state.idSet.has(evt.id)) return;
          state.idSet.add(evt.id);
          state.allTimeline.push(evt);
        });

        pruneEventCollapseState();
        syncSessionFilterOptions();
        state.cursor = getFilteredTimeline().length;
        state.forceBottom = true;
        render();
      }

      async function loadHistory() {
        const query = new URLSearchParams({
          limit: "1200",
          includeInternal: "1"
        });
        const res = await fetch(`/api/history?${query.toString()}`, { cache: "no-store" });
        if (!res.ok) throw new Error(`history:${res.status}`);
        const payload = await res.json();
        return Array.isArray(payload.items) ? payload.items : [];
      }

      function computeLayout(visible, options = {}) {
        const agents = buildAgentList(visible);
        const viewportW = Math.max(760, options.viewportWidth || diagramScroll.clientWidth || 1020);
        const viewportH = Math.max(460, options.viewportHeight || diagramScroll.clientHeight || 560);
        const headerLabelMaxW = 172;
        const headerMetrics = new Map();

        let maxHeaderBoxW = 136;
        let maxHeaderLines = 1;

        agents.forEach((agentId) => {
          const wrapped = wrapTextWithEllipsis(displayAgent(agentId), headerLabelMaxW, 2, HEADER_TEXT_FONT);
          const widestLine = wrapped.lines.length
            ? Math.max(...wrapped.lines.map((line) => measureTextWidth(line, HEADER_TEXT_FONT)))
            : 0;
          maxHeaderBoxW = Math.max(maxHeaderBoxW, Math.ceil(widestLine + 28));
          maxHeaderLines = Math.max(maxHeaderLines, wrapped.lines.length);
          headerMetrics.set(agentId, wrapped);
        });

        const headerBoxW = clamp(maxHeaderBoxW, 136, 200);
        const headerBoxH = maxHeaderLines > 1 ? 48 : 36;
        const headerHeight = headerBoxH + 28;

        const side = 110;
        let gap = 0;

        if (agents.length > 1) {
          const adaptive = Math.floor((viewportW - side * 2) / (agents.length - 1));
          gap = Math.max(182, adaptive, headerBoxW + 48);
        }

        const width = Math.max(viewportW, side * 2 + gap * Math.max(agents.length - 1, 0) + 10);
        const xMap = new Map();

        agents.forEach((agentId, idx) => {
          xMap.set(agentId, side + idx * gap);
        });

        const labelMaxW = Math.min(440, Math.max(220, agents.length > 1 ? gap * 1.3 : 320));

        const rows = [];
        let y = 14;
        let prevSession = "";
        let i = 0;
        const PARALLEL_WINDOW_MS = 1800;

        while (i < visible.length) {
          const evt = visible[i];
          const currentSession = evt.sessionTag || "";
          if (prevSession && currentSession && currentSession !== prevSession) {
            rows.push({
              type: "separator",
              y,
              h: 26,
              text: "新会话"
            });
            y += 32;
          }
          prevSession = currentSession || prevSession;

          if (isParallelSpawnSeed(evt)) {
            const group = [evt];
            let j = i + 1;
            while (j < visible.length) {
              const next = visible[j];
              if (!isParallelSpawnSeed(next)) break;
              if (next.from !== evt.from) break;
              if ((next.sessionTag || "") !== (evt.sessionTag || "")) break;
              if ((next.ts - evt.ts) > PARALLEL_WINDOW_MS) break;
              group.push(next);
              j += 1;
            }

            if (group.length >= 2) {
              const gapY = 8;
              let gy = y + 26;
              const items = group.map((entry) => {
                const metrics = buildEventMetrics(entry, gy, labelMaxW, 5);
                gy += metrics.h + gapY;
                return metrics;
              });
              const blockH = Math.max(56, gy - y + 10);
              rows.push({
                type: "parallel",
                y,
                h: blockH,
                title: `并行 sessions_spawn ×${group.length}`,
                items
              });
              y += blockH + 14;
              i = j;
              continue;
            }
          }

          const metrics = buildEventMetrics(evt, y, labelMaxW, 6);
          rows.push({
            type: "event",
            ...metrics
          });
          y += metrics.h + 14;
          i += 1;
        }

        const height = Math.max(viewportH - headerHeight, y + 36);

        return {
          agents,
          width,
          height,
          xMap,
          rows,
          headerMetrics,
          headerBoxW,
          headerBoxH,
          headerHeight
        };
      }

      function createSvgRoot() {
        const svg = document.createElementNS(NS, "svg");
        svg.setAttribute("xmlns", NS);
        return svg;
      }

      function serializeSvg(svgEl) {
        svgEl.setAttribute("xmlns", NS);
        return new XMLSerializer().serializeToString(svgEl);
      }

      function drawHeader(layout, targetSvg = diagramHeaderSvg) {
        const { agents, width, xMap, headerMetrics, headerBoxW, headerBoxH, headerHeight } = layout;
        const palette = getDiagramPalette();

        targetSvg.setAttribute("width", String(width));
        targetSvg.setAttribute("height", String(headerHeight));
        targetSvg.setAttribute("viewBox", `0 0 ${width} ${headerHeight}`);
        targetSvg.style.height = `${headerHeight}px`;
        targetSvg.textContent = "";

        const bg = document.createElementNS(NS, "rect");
        bg.setAttribute("x", "0");
        bg.setAttribute("y", "0");
        bg.setAttribute("width", String(width));
        bg.setAttribute("height", String(headerHeight));
        bg.setAttribute("fill", palette.headerBg);
        targetSvg.appendChild(bg);

        agents.forEach((agentId) => {
          const x = xMap.get(agentId);
          const badge = headerMetrics.get(agentId) || wrapTextWithEllipsis(displayAgent(agentId), 160, 2, HEADER_TEXT_FONT);
          const boxY = 14;
          const lineGap = 16;
          const firstLineY = boxY + (headerBoxH - (badge.lines.length - 1) * lineGap) / 2 + 5;

          const box = document.createElementNS(NS, "rect");
          box.setAttribute("x", String(x - headerBoxW / 2));
          box.setAttribute("y", String(boxY));
          box.setAttribute("width", String(headerBoxW));
          box.setAttribute("height", String(headerBoxH));
          box.setAttribute("rx", "12");
          box.setAttribute("fill", palette.headerBox);
          box.setAttribute("stroke", palette.headerStroke);
          const title = document.createElementNS(NS, "title");
          title.textContent = displayAgent(agentId);
          box.appendChild(title);
          targetSvg.appendChild(box);

          badge.lines.forEach((line, lineIdx) => {
            const label = document.createElementNS(NS, "text");
            label.setAttribute("x", String(x));
            label.setAttribute("y", String(firstLineY + lineIdx * lineGap));
            label.setAttribute("text-anchor", "middle");
            label.setAttribute("fill", palette.headerText);
            label.setAttribute("font-size", "13.5");
            label.setAttribute("font-weight", "700");
            label.textContent = line;
            targetSvg.appendChild(label);
          });
        });
      }

      function drawBody(layout, options = {}) {
        const { agents, width, height, xMap, rows } = layout;
        const targetSvg = options.targetSvg || diagram;
        const interactive = options.interactive !== false;
        const includeDataAttrs = Boolean(options.includeDataAttrs);
        const selectedEventId = options.selectedEventId !== undefined ? options.selectedEventId : state.selectedEventId;
        const palette = getDiagramPalette();

        targetSvg.setAttribute("width", String(width));
        targetSvg.setAttribute("height", String(height));
        targetSvg.setAttribute("viewBox", `0 0 ${width} ${height}`);
        targetSvg.textContent = "";

        const defs = document.createElementNS(NS, "defs");
        const markerData = [
          ["arr-user", "#80cfff"],
          ["arr-spawn", "#ffcc7a"],
          ["arr-a2a", "#67e6c7"],
          ["arr-internal", "#ff9ac1"]
        ];

        markerData.forEach(([id, color]) => {
          const marker = document.createElementNS(NS, "marker");
          marker.setAttribute("id", id);
          marker.setAttribute("markerWidth", "9");
          marker.setAttribute("markerHeight", "9");
          marker.setAttribute("refX", "7");
          marker.setAttribute("refY", "4.5");
          marker.setAttribute("orient", "auto");

          const poly = document.createElementNS(NS, "polygon");
          poly.setAttribute("points", "0 0, 9 4.5, 0 9");
          poly.setAttribute("fill", color);
          marker.appendChild(poly);
          defs.appendChild(marker);
        });

        targetSvg.appendChild(defs);

        agents.forEach((agentId) => {
          const x = xMap.get(agentId);

          const lane = document.createElementNS(NS, "line");
          lane.setAttribute("x1", String(x));
          lane.setAttribute("x2", String(x));
          lane.setAttribute("y1", "0");
          lane.setAttribute("y2", String(height));
          lane.setAttribute("stroke", palette.lane);
          lane.setAttribute("stroke-width", "1.4");
          lane.setAttribute("stroke-dasharray", "6 6");
          targetSvg.appendChild(lane);
        });

        let alt = false;
        rows.forEach((row) => {
          if (row.type !== "event" && row.type !== "parallel") return;
          alt = !alt;
          if (!alt) return;
          const bg = document.createElementNS(NS, "rect");
          bg.setAttribute("x", "0");
          bg.setAttribute("y", String(row.y - 6));
          bg.setAttribute("width", String(width));
          bg.setAttribute("height", String(row.h + 12));
          bg.setAttribute("fill", palette.rowAlt);
          targetSvg.appendChild(bg);
        });

        let lastEventAnchor = null;

        const drawInlineIconText = ({
          iconName = "",
          text = "",
          x = 0,
          baselineY = 0,
          color = palette.chipText,
          fontSize = 11,
          fontWeight = "700",
          iconSize = 12
        }) => {
          const iconGap = iconName ? iconSize + 5 : 0;
          const textWidth = measureTextWidth(text);
          const totalWidth = textWidth + iconGap;
          const startX = x - totalWidth / 2;
          if (iconName) {
            appendSvgIcon(targetSvg, iconName, {
              x: startX,
              y: baselineY - iconSize + 2,
              size: iconSize,
              color,
              strokeWidth: 1.85
            });
          }
          const label = document.createElementNS(NS, "text");
          label.setAttribute("x", String(startX + iconGap));
          label.setAttribute("y", String(baselineY));
          label.setAttribute("text-anchor", "start");
          label.setAttribute("fill", color);
          label.setAttribute("font-size", String(fontSize));
          label.setAttribute("font-weight", fontWeight);
          label.setAttribute("pointer-events", "none");
          label.textContent = text;
          targetSvg.appendChild(label);
          return totalWidth;
        };

        const drawMechanismBadge = (x, y, text, color, iconName) => {
          if (!text) return;
          const w = Math.ceil(measureTextWidth(text) + 14 + (iconName ? 16 : 0));
          const rx = x - w / 2;
          const badge = document.createElementNS(NS, "rect");
          badge.setAttribute("x", String(rx));
          badge.setAttribute("y", String(y - 19));
          badge.setAttribute("width", String(w));
          badge.setAttribute("height", "16");
          badge.setAttribute("rx", "8");
          badge.setAttribute("fill", palette.badgeBg);
          badge.setAttribute("stroke", color);
          badge.setAttribute("stroke-width", "1");
          targetSvg.appendChild(badge);

          drawInlineIconText({
            iconName,
            text,
            x,
            baselineY: y - 7,
            color,
            fontSize: 10.5,
            iconSize: 11
          });
        };

        const drawEventItem = (item, options = {}) => {
          const evt = item.evt;
          const color = modeColor[evt.mode] || "#67e6c7";
          const isSelected = evt.id === selectedEventId;
          const fromX = xMap.get(evt.from);
          const toX = xMap.get(evt.to);
          const markerId =
            evt.mode === "spawn"
              ? "arr-spawn"
              : evt.mode === "user"
                ? "arr-user"
                : evt.mode === "internal"
                  ? "arr-internal"
                  : "arr-a2a";

          let boxX;
          if (fromX === toX) {
            boxX = clamp(fromX + 28, 8, width - item.boxW - 8);
          } else {
            boxX = clamp((fromX + toX) / 2 - item.boxW / 2, 8, width - item.boxW - 8);
          }

          if (isSelected) {
            const halo = document.createElementNS(NS, "rect");
            halo.setAttribute("x", String(boxX - 4));
            halo.setAttribute("y", String(item.y - 4));
            halo.setAttribute("width", String(item.boxW + 8));
            halo.setAttribute("height", String(item.textH + 8));
            halo.setAttribute("rx", "11");
            halo.setAttribute("fill", color);
            halo.setAttribute("fill-opacity", "0.09");
            halo.setAttribute("stroke", color);
            halo.setAttribute("stroke-opacity", "0.34");
            halo.setAttribute("pointer-events", "none");
            targetSvg.appendChild(halo);
          }

          const labelBox = document.createElementNS(NS, "rect");
          labelBox.setAttribute("x", String(boxX));
          labelBox.setAttribute("y", String(item.y));
          labelBox.setAttribute("width", String(item.boxW));
          labelBox.setAttribute("height", String(item.textH));
          labelBox.setAttribute("rx", "8");
          labelBox.setAttribute("fill", isSelected ? palette.titleFill : palette.cardFill);
          labelBox.setAttribute("stroke", isSelected ? color : palette.cardStroke);
          labelBox.setAttribute("stroke-width", isSelected ? "1.4" : "1");
          labelBox.style.cursor = "pointer";

          const fullMeta = `${formatDateTime(evt.ts)} · ${modeName(evt)} · ${displayAgent(evt.from)} → ${displayAgent(evt.to)} · 点击查看完整正文`;
          if (includeDataAttrs) {
            labelBox.setAttribute("data-hover-meta", fullMeta);
            labelBox.setAttribute("data-hover-body", evt.text);
          }

          const applyCardState = (hovered) => {
            const active = hovered || isSelected;
            labelBox.setAttribute("fill", active ? palette.titleFill : palette.cardFill);
            labelBox.setAttribute("stroke", active ? color : palette.cardStroke);
            labelBox.setAttribute("stroke-width", active ? "1.4" : "1");
          };

          if (interactive) {
            labelBox.setAttribute("tabindex", "0");
            labelBox.setAttribute("focusable", "true");
            labelBox.setAttribute("role", "button");
            labelBox.setAttribute("aria-pressed", isSelected ? "true" : "false");
            labelBox.setAttribute("aria-label", `${detailTitleText(evt)}，点击查看完整正文`);
            labelBox.addEventListener("mouseenter", () => applyCardState(true));
            labelBox.addEventListener("mouseleave", () => applyCardState(false));
            labelBox.addEventListener("focus", () => applyCardState(true));
            labelBox.addEventListener("blur", () => applyCardState(false));
            labelBox.addEventListener("click", () => {
              selectEvent(evt.id);
            });
            labelBox.addEventListener("keydown", (event) => {
              if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                selectEvent(evt.id);
              }
            });
          }
          targetSvg.appendChild(labelBox);

          if (item.collapsed) {
            const compactIconX = boxX + 12;
            const compactTitleX = boxX + (item.bodyIconName ? 29 : 14);
            const compactTitleText = fitText(
              item.compactTitle,
              Math.max(48, item.boxW - item.toggleW - (item.bodyIconName ? 78 : 62))
            );

            if (item.bodyIconName) {
              appendSvgIcon(targetSvg, item.bodyIconName, {
                x: compactIconX,
                y: item.y + 12,
                size: 12,
                color,
                strokeWidth: 1.85
              });
            }

            const compactTitle = document.createElementNS(NS, "text");
            compactTitle.setAttribute("x", String(compactTitleX));
            compactTitle.setAttribute("y", String(item.y + 20));
            compactTitle.setAttribute("fill", palette.bodyText);
            compactTitle.setAttribute("font-size", "12");
            compactTitle.setAttribute("font-weight", "700");
            compactTitle.setAttribute("pointer-events", "none");
            compactTitle.textContent = compactTitleText;
            targetSvg.appendChild(compactTitle);

            const compactTime = document.createElementNS(NS, "text");

            toggleText.textContent = item.toggleText;
            targetSvg.appendChild(toggleText);

            if (fromX === toX) {
              const loopPath = document.createElementNS(NS, "path");
              const d = `M ${fromX} ${item.arrowY} H ${fromX + 52} V ${item.arrowY + 22} H ${fromX + 7}`;
              loopPath.setAttribute("d", d);
              loopPath.setAttribute("fill", "none");
              loopPath.setAttribute("stroke", color);
              loopPath.setAttribute("stroke-width", "2");

            const dot = document.createElementNS(NS, "circle");

          const setToggleState = (hovered) => {
            toggleBg.setAttribute("fill", hovered ? palette.titleFill : palette.chipFill);

          dot.setAttribute("fill", color);

          if (options.markAsLast) {

        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(url), 0);

  <script>
    (() => {

      const copyToast = document.getElementById("copy-toast");
      let copyToastTimer = null;

      function hideHoverPop() {
        hoverPop.style.display = "none";

      function positionHoverPop(event) {
        if (hoverPop.style.display !== "block") return;
        const margin = 12;
        let left = event.clientX + 14;
        let top = event.clientY + 14;
        const maxLeft = window.innerWidth - hoverPop.offsetWidth - margin;
        const maxTop = window.innerHeight - hoverPop.offsetHeight - margin;
        if (left > maxLeft) left = Math.max(margin, maxLeft);
        if (top > maxTop) top = Math.max(margin, maxTop);
        hoverPop.style.left = left + "px";
        hoverPop.style.top = top + "px";
      }

      function showHoverPop(event, meta, body) {
        hoverPopMeta.textContent = meta;
        hoverPopBody.textContent = body;
        hoverPop.style.display = "block";
        positionHoverPop(event);

        copyToast.textContent = text;

          copyToast.style.display = "none";
          copyToastTimer = null;

      async function copyEventText(text) {

        if (!value) return;

        try {
          if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
            await navigator.clipboard.writeText(value);
          } else {
            const input = document.createElement("textarea");
            input.value = value;
            input.setAttribute("readonly", "true");
            input.style.position = "fixed";
            input.style.top = "-9999px";
            document.body.appendChild(input);
            input.select();
            document.execCommand("copy");
            document.body.removeChild(input);
          }
          showCopyToast("已复制全文");
        } catch {
          showCopyToast("复制失败");
        }
      }

      document.querySelectorAll("[data-hover-body]").forEach((node) => {
        node.addEventListener("mouseenter", (event) => {
          showHoverPop(event, node.getAttribute("data-hover-meta") || "", node.getAttribute("data-hover-body") || "");
        });
        node.addEventListener("mousemove", positionHoverPop);
        node.addEventListener("mouseleave", hideHoverPop);
        node.addEventListener("click", () => {
          void copyEventText(node.getAttribute("data-hover-body") || "");
        });
      });

      window.addEventListener("scroll", hideHoverPop, { passive: true });
      window.addEventListener("resize", hideHoverPop);
    })();
  <\/script>
</body>
</html>`;
      }

      function exportHtmlSnapshot() {
        const filtered = getFilteredTimeline();
        if (!filtered.length) {
          showCopyToast("当前筛选下无事件");
          return;
        }

        const layout = computeLayout(filtered, {
          viewportWidth: Math.max(760, diagramScroll.clientWidth || 1020),
          viewportHeight: Math.max(460, diagramScroll.clientHeight || 560)
        });
        const headerSvg = createSvgRoot();
        const bodySvg = createSvgRoot();
        drawHeader(layout, headerSvg);
        drawBody(layout, {
          targetSvg: bodySvg,
          interactive: false,
          includeDataAttrs: true,
          selectedEventId: null
        });

        const exportedAt = Date.now();
        const html = buildSnapshotHtml({
          headerSvgMarkup: serializeSvg(headerSvg),
          bodySvgMarkup: serializeSvg(bodySvg),
          exportedAt,
          filterLabel: getSessionFilterLabel(),
          timeLabel: getTimeFilterLabel(),
          thinkingExpanded: state.showInternal,
          eventCount: filtered.length
        });
        const filename = `openclaw-timeline-${formatFileTimestamp(exportedAt)}.html`;
        downloadTextFile(filename, html);
      }

      function renderControls() {
        const total = getFilteredTimeline().length;
        const shown = state.cursor;
        const timeRange = getTimeFilterRange();

        progressInput.max = String(Math.max(0, total));
        progressInput.value = String(shown);
        progressTextEl.textContent = `${shown} / ${total}`;
        timeStartInput.value = String(timeRange.startHour);
        timeEndInput.value = String(timeRange.endHour);
        timeFilterTextEl.textContent = getTimeFilterLabel(timeRange);
        timeStartTextEl.textContent = formatHourLabel(timeRange.startHour);
        timeEndTextEl.textContent = formatHourLabel(timeRange.endHour);
        timeFilterNoteEl.textContent = getTimeFilterRangeLabel();

        prevBtn.disabled = shown <= 0;
        nextBtn.disabled = shown >= total;
        exportBtn.disabled = total <= 0;
        thinkingBtn.textContent = state.showInternal ? "折叠思考信息" : "展开思考信息";
        thinkingBtn.classList.toggle("is-primary", state.showInternal);
        sessionFilterEl.value = state.sessionFilter;
        syncShellState();
      }

      function render(options = {}) {
        const preserveScroll = Boolean(options.preserveScroll);
        const shouldAutoScroll = Boolean(options.autoScroll || state.forceBottom);
        const previousScrollTop = diagramScroll.scrollTop;
        const previousScrollLeft = diagramScroll.scrollLeft;
        const filtered = getFilteredTimeline();
        state.cursor = clamp(state.cursor, 0, filtered.length);
        renderControls();

        const visible = filtered.slice(0, state.cursor);
        if (state.selectedEventId && !visible.some((evt) => evt.id === state.selectedEventId)) {
          state.selectedEventId = null;
        }
        renderDetailPanel(visible);
        const layout = computeLayout(visible);
        drawHeader(layout);
        drawBody(layout);

        if (shouldAutoScroll) {
          requestAnimationFrame(() => {
            diagramScroll.scrollTop = diagramScroll.scrollHeight;
          });
          state.forceBottom = false;
          return;
        }

        if (preserveScroll) {
          requestAnimationFrame(() => {
            const maxScrollTop = Math.max(0, diagramScroll.scrollHeight - diagramScroll.clientHeight);
            const maxScrollLeft = Math.max(0, diagramScroll.scrollWidth - diagramScroll.clientWidth);
            diagramScroll.scrollTop = Math.min(previousScrollTop, maxScrollTop);
            diagramScroll.scrollLeft = Math.min(previousScrollLeft, maxScrollLeft);
          });
        }
      }

      function stepBy(delta) {
        const total = getFilteredTimeline().length;
        if (!total) return;

        state.cursor = clamp(state.cursor + delta, 0, total);
        render({ autoScroll: delta > 0 && state.cursor >= total });
      }

      function seekTo(target) {
        const total = getFilteredTimeline().length;
        state.cursor = clamp(target, 0, total);
        render({ autoScroll: state.cursor >= total });
      }

      function connectEvents() {
        if (state.source) {
          state.source.close();
          state.source = null;
        }

        setLiveState("connecting", "连接中");

        const source = new EventSource("/api/events?includeInternal=1");
        state.source = source;

        source.onopen = () => setLiveState("online", "已连接");
        source.onmessage = (event) => {
          try {
            const parsed = JSON.parse(event.data);
            const evt = normalizeEvent(parsed);
            addEvent(evt, true);
          } catch {
            // Ignore malformed event payloads.
          }
        };
        source.onerror = () => {
          setLiveState("reconnecting", "重连中");
        };
      }

      async function initialize() {
        try {
          const items = await loadHistory();
          rebuildFromHistory(items);
          setLiveState("online", "已连接");
        } catch (err) {
          console.error(err);
          setLiveState("reconnecting", "历史读取失败");
          render();
        }

        connectEvents();
      }

      prevBtn.addEventListener("click", () => stepBy(-1));
      nextBtn.addEventListener("click", () => stepBy(1));

      themeToggleBtn.addEventListener("click", () => {
        applyTheme(state.theme === "dark" ? "light" : "dark");
        writeStorage(THEME_STORAGE_KEY, state.theme);
        scheduleRelayout();
      });

      sidebarToggleBtn.addEventListener("click", () => {
        state.sidebarCollapsed = !state.sidebarCollapsed;
        writeStorage(SIDEBAR_STORAGE_KEY, state.sidebarCollapsed ? "1" : "0");
        syncShellState();
        scheduleRelayout();
      });

      reloadBtn.addEventListener("click", async () => {
        try {
          const items = await loadHistory();
          rebuildFromHistory(items);
        } catch {
          setLiveState("reconnecting", "历史读取失败");
        }
      });

      exportBtn.addEventListener("click", () => {
        exportHtmlSnapshot();
      });

      detailCopyBtn.addEventListener("click", () => {
        void copyEventText(detailCopyBtn.dataset.copyText || "");
      });

      detailClearBtn.addEventListener("click", () => {
        selectEvent(null);
      });

      thinkingBtn.addEventListener("click", () => {
        state.showInternal = !state.showInternal;
        resetEventCollapseState();
        render({ preserveScroll: true });
      });

      sessionFilterEl.addEventListener("change", () => {
        state.sessionFilter = sessionFilterEl.value || "all";
        state.sessionFilterTouched = true;
        state.cursor = getFilteredTimeline().length;
        state.forceBottom = true;
        render();
      });

      timeStartInput.addEventListener("input", () => {
        const previousTotal = getFilteredTimeline().length;
        const atTail = state.cursor >= previousTotal;
        const nextStart = clamp(Math.round(Number(timeStartInput.value || 0)), 0, 23);
        state.timeStartHour = nextStart;
        state.timeEndHour = Math.max(nextStart + 1, Number(state.timeEndHour) || 24);
        const nextTotal = getFilteredTimeline().length;
        state.cursor = atTail ? nextTotal : clamp(state.cursor, 0, nextTotal);
        render({ autoScroll: atTail, preserveScroll: !atTail });
      });

      timeEndInput.addEventListener("input", () => {
        const previousTotal = getFilteredTimeline().length;
        const atTail = state.cursor >= previousTotal;
        const nextEnd = clamp(Math.round(Number(timeEndInput.value || 24)), 1, 24);
        state.timeEndHour = nextEnd;
        state.timeStartHour = Math.min(Number(state.timeStartHour) || 0, nextEnd - 1);
        const nextTotal = getFilteredTimeline().length;
        state.cursor = atTail ? nextTotal : clamp(state.cursor, 0, nextTotal);
        render({ autoScroll: atTail, preserveScroll: !atTail });
      });

      progressInput.addEventListener("input", () => {
        seekTo(Number(progressInput.value || 0));
      });

      window.addEventListener("resize", () => {
        scheduleRelayout();
      });

      diagramScroll.addEventListener("dblclick", (event) => {
        if (!isBlankBoardClickTarget(event.target)) return;
        collapseSidePanels();
      });

      syncSessionFilterOptions();
      render();
      initialize();
    })();
  </script>
</body>
</html>
