<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenClaw 执行时序图</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap");

    :root {
      color-scheme: dark;
      --bg-0: #091320;
      --bg-1: #0f2338;
      --page-bg: radial-gradient(circle at 14% 2%, rgba(73, 132, 180, 0.22) 0%, rgba(10, 21, 34, 0) 28%), radial-gradient(circle at 88% 12%, rgba(106, 212, 210, 0.1) 0%, rgba(10, 21, 34, 0) 22%), linear-gradient(180deg, #07101a, #08111b 72%);
      --app-bg: linear-gradient(180deg, rgba(10, 21, 34, 0.97), rgba(7, 14, 23, 0.99));
      --sidebar-bg: linear-gradient(180deg, rgba(12, 26, 40, 0.985), rgba(8, 17, 29, 0.995));
      --board-bg: radial-gradient(circle at 18% 10%, rgba(120, 183, 255, 0.055), rgba(120, 183, 255, 0) 28%), linear-gradient(180deg, rgba(7, 16, 27, 0.99), rgba(6, 14, 24, 0.995));
      --panel-bg: rgba(14, 31, 47, 0.84);
      --panel-bg-strong: rgba(19, 38, 58, 0.94);
      --panel-border: rgba(145, 220, 236, 0.16);
      --line: rgba(145, 220, 236, 0.24);
      --line-soft: rgba(145, 220, 236, 0.12);
      --text: #ecf8ff;
      --text-soft: #c7dbeb;
      --text-muted: rgba(199, 219, 235, 0.68);
      --a2a: #72cbdb;
      --spawn: #8dd3c7;
      --user: #78b7ff;
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
      --header-h: 66px;
      --sidebar-w: 350px;
      --sidebar-collapsed-w: 74px;
      --button-bg: rgba(36, 73, 101, 0.52);
      --button-hover: rgba(50, 92, 125, 0.64);
      --button-border: rgba(150, 205, 231, 0.22);
      --button-ghost-bg: rgba(22, 46, 67, 0.74);
      --input-bg: rgba(12, 28, 42, 0.94);
      --input-border: rgba(143, 195, 220, 0.2);
      --hover-bg: rgba(7, 24, 39, 0.96);
      --hover-border: rgba(149, 227, 240, 0.4);
      --toast-bg: rgba(13, 48, 42, 0.92);
      --toast-border: rgba(103, 230, 199, 0.42);
      --toast-text: #d9fff4;
      --svg-header-bg: rgba(8, 20, 34, 0.88);
      --svg-header-box: rgba(11, 35, 54, 0.86);
      --svg-header-stroke: rgba(149, 227, 240, 0.42);
      --svg-header-text: #e9f8ff;
      --svg-lane: rgba(148, 224, 240, 0.28);
      --svg-row-alt: rgba(120, 208, 230, 0.03);
      --svg-card-fill: rgba(7, 24, 39, 0.9);
      --svg-card-stroke: rgba(150, 225, 240, 0.25);
      --svg-chip-fill: rgba(17, 42, 62, 0.92);
      --svg-chip-stroke: rgba(146, 214, 229, 0.2);
      --svg-chip-text: #d8edf8;
      --svg-title-fill: rgba(16, 43, 66, 0.94);
      --svg-body-text: #f5fcff;
      --svg-separator-stroke: rgba(141, 203, 199, 0.44);
      --svg-separator-bg: rgba(13, 42, 46, 0.88);
      --svg-separator-text: #d5f3ed;
      --svg-parallel-fill: rgba(42, 74, 70, 0.16);
      --svg-parallel-stroke: rgba(141, 203, 199, 0.34);
      --svg-focus: rgba(110, 225, 245, 0.32);
      --svg-empty: rgba(212, 238, 251, 0.72);
      --svg-badge-bg: rgba(8, 22, 35, 0.94);
      --grid-line: rgba(114, 179, 228, 0.05);
      --grid-line-strong: rgba(114, 179, 228, 0.028);
      --dock-bg: linear-gradient(180deg, rgba(31, 58, 82, 0.94), rgba(21, 43, 63, 0.98));
      --dock-bg-hover: linear-gradient(180deg, rgba(44, 77, 106, 0.96), rgba(26, 50, 72, 0.99));
      --dock-border: rgba(154, 219, 239, 0.2);
      --dock-shadow: 0 10px 18px rgba(0, 0, 0, 0.18);
      --dock-icon: #dff5ff;
      --brand-glow: rgba(97, 220, 186, 0.18);
      --brand-shell: rgba(255, 134, 94, 0.94);
      --brand-shell-dark: rgba(236, 96, 64, 0.96);
      --brand-accent: rgba(255, 230, 166, 0.96);
      --font-ui: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    html[data-theme="light"] {
      color-scheme: light;
      --bg-0: #e6eef8;
      --bg-1: #dce7f3;
      --page-bg: radial-gradient(circle at 16% 4%, rgba(121, 183, 229, 0.24) 0%, rgba(255,255,255,0) 28%), linear-gradient(180deg, #eef4fb, #e4edf7 62%);
      --app-bg: linear-gradient(180deg, rgba(249, 252, 255, 0.97), rgba(237, 244, 251, 0.99));
      --sidebar-bg: linear-gradient(180deg, rgba(246, 250, 255, 0.985), rgba(235, 242, 250, 0.995));
      --board-bg: radial-gradient(circle at 16% 8%, rgba(141, 201, 233, 0.16), rgba(141, 201, 233, 0) 34%), linear-gradient(180deg, rgba(244, 249, 255, 0.99), rgba(229, 238, 247, 0.995));
      --panel-bg: rgba(255, 255, 255, 0.76);
      --panel-bg-strong: rgba(248, 251, 255, 0.96);
      --panel-border: rgba(49, 88, 122, 0.13);
      --line: rgba(49, 88, 122, 0.18);
      --line-soft: rgba(49, 88, 122, 0.1);
      --text: #15304a;
      --text-soft: #50667d;
      --text-muted: rgba(80, 102, 125, 0.72);
      --shadow: 0 20px 42px rgba(49, 83, 115, 0.12);
      --button-bg: rgba(240, 246, 251, 0.98);
      --button-hover: rgba(229, 239, 248, 0.99);
      --button-border: rgba(55, 96, 132, 0.18);
      --button-ghost-bg: rgba(241, 247, 252, 0.95);
      --input-bg: rgba(255, 255, 255, 0.98);
      --input-border: rgba(55, 96, 132, 0.16);
      --hover-bg: rgba(251, 254, 255, 0.98);
      --hover-border: rgba(55, 96, 132, 0.22);
      --toast-bg: rgba(228, 248, 239, 0.96);
      --toast-border: rgba(57, 160, 110, 0.32);
      --toast-text: #176140;
      --svg-header-bg: rgba(230, 239, 248, 0.92);
      --svg-header-box: rgba(250, 253, 255, 0.97);
      --svg-header-stroke: rgba(68, 118, 156, 0.2);
      --svg-header-text: #173650;
      --svg-lane: rgba(72, 119, 156, 0.2);
      --svg-row-alt: rgba(118, 181, 222, 0.085);
      --svg-card-fill: rgba(252, 254, 255, 0.97);
      --svg-card-stroke: rgba(68, 118, 156, 0.19);
      --svg-chip-fill: rgba(239, 246, 252, 0.99);
      --svg-chip-stroke: rgba(68, 118, 156, 0.16);
      --svg-chip-text: #274359;
      --svg-title-fill: rgba(234, 242, 250, 0.99);
      --svg-body-text: #16314a;
      --svg-separator-stroke: rgba(109, 181, 175, 0.36);
      --svg-separator-bg: rgba(234, 246, 245, 0.98);
      --svg-separator-text: #215c58;
      --svg-parallel-fill: rgba(223, 243, 240, 0.52);
      --svg-parallel-stroke: rgba(109, 181, 175, 0.22);
      --svg-focus: rgba(80, 166, 211, 0.22);
      --svg-empty: rgba(70, 97, 121, 0.66);
      --svg-badge-bg: rgba(245, 249, 253, 0.99);
      --grid-line: rgba(98, 145, 179, 0.082);
      --grid-line-strong: rgba(98, 145, 179, 0.04);
      --dock-bg: linear-gradient(180deg, rgba(250, 253, 255, 0.98), rgba(235, 242, 250, 0.99));
      --dock-bg-hover: linear-gradient(180deg, rgba(243, 249, 254, 0.99), rgba(225, 236, 247, 0.99));
      --dock-border: rgba(55, 96, 132, 0.2);
      --dock-shadow: 0 10px 18px rgba(57, 92, 126, 0.12);
      --dock-icon: #28435b;
      --brand-glow: rgba(88, 204, 173, 0.14);
      --brand-shell: rgba(255, 126, 92, 0.96);
      --brand-shell-dark: rgba(233, 103, 73, 0.98);
      --brand-accent: rgba(255, 240, 194, 0.98);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--page-bg), var(--bg-0);
      color: var(--text);
      font-family: var(--font-ui);
    }

    body {
      padding: 14px;
      overflow: hidden;
    }

    html, body, .app, .sidebar, .board, .control-panel, .button, .filter-wrap select, .live-state, .brand-pill, .detail-panel, .detail-content, .detail-tag {
      transition: background 180ms ease, background-color 180ms ease, color 180ms ease, border-color 180ms ease, box-shadow 180ms ease, opacity 180ms ease;
    }

    @keyframes gentleRise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .app {
      max-width: 1600px;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      background: var(--app-bg);
      height: calc(100vh - 28px);
      min-height: 680px;
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
      transition: grid-template-columns 180ms ease;
    }

    .app.is-sidebar-collapsed {
      grid-template-columns: var(--sidebar-collapsed-w) minmax(0, 1fr);
    }

    .sidebar {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--line-soft);
      position: relative;
      z-index: 5;
    }

    .sidebar-head {
      padding: 18px 16px 14px;
      display: grid;
      gap: 14px;
      border-bottom: 1px solid var(--line-soft);
      background: radial-gradient(circle at 14% 0%, rgba(137, 199, 232, 0.12), rgba(137, 199, 232, 0) 34%), linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent);
      animation: gentleRise 360ms ease both;
    }

    .sidebar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 46px;
      height: 34px;
      gap: 8px;
      padding: 0 12px 0 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(87, 203, 243, 0.16), rgba(110, 242, 205, 0.14));
      border: 1px solid var(--panel-border);
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .brand-pill__short {
      display: none;
    }

    .brand-mark {
      position: relative;
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.16));
    }

    .brand-mark svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    .brand-mark__glow {
      fill: var(--brand-glow);
    }

    .brand-mark__shell {
      fill: var(--brand-shell);
    }

    .brand-mark__shell-dark {
      fill: var(--brand-shell-dark);
    }

    .brand-mark__accent {
      fill: var(--brand-accent);
    }

    .sidebar-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .title-wrap { display: grid; gap: 6px; }

    .title {
      margin: 0;
      font-family: var(--font-ui);
      font-size: clamp(24px, 2vw, 32px);
      letter-spacing: 0.18px;
      line-height: 1.08;
      font-weight: 700;
    }

    .subtitle {
      margin: 0;
      font-size: 13px;
      color: var(--text-soft);
      line-height: 1.55;
    }

    .live-state {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--panel-border);
      background: var(--panel-bg);
      font-size: 11px;
      color: var(--text);
      white-space: nowrap;
      width: fit-content;
    }

    .live-state[data-state="online"] {
      border-color: rgba(103, 230, 199, 0.62);
      color: #c7ffef;
      background: rgba(29, 84, 72, 0.5);
    }

    .live-state[data-state="reconnecting"] {
      border-color: rgba(255, 204, 122, 0.7);
      color: #ffe7c0;
      background: rgba(88, 58, 23, 0.56);
    }

    html[data-theme="light"] .live-state[data-state="online"] {
      color: #176140;
      background: rgba(180, 239, 214, 0.68);
    }

    html[data-theme="light"] .live-state[data-state="reconnecting"] {
      color: #8a5400;
      background: rgba(255, 228, 181, 0.86);
    }

    .sidebar-toolbar {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 16px;
      display: grid;
      gap: 14px;
      align-content: start;
      scrollbar-gutter: stable;
      scroll-behavior: smooth;
    }

    .control-panel {
      display: grid;
      gap: 12px;
      padding: 14px;
      border-radius: 18px;
      border: 1px solid var(--panel-border);
      background: var(--panel-bg);
      backdrop-filter: blur(6px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 14px 30px rgba(0, 0, 0, 0.14);
      animation: gentleRise 420ms ease both;
    }

    .control-panel:nth-of-type(2) { animation-delay: 40ms; }
    .control-panel:nth-of-type(3) { animation-delay: 80ms; }
    .control-panel:nth-of-type(4) { animation-delay: 120ms; }
    .control-panel:nth-of-type(5) { animation-delay: 160ms; }

    .control-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .control-panel-title {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .button-grid--single {
      grid-template-columns: 1fr;
    }

    .button {
      border: 1px solid var(--button-border);
      color: var(--text);
      background: var(--button-bg);
      border-radius: 16px;
      padding: 10px 12px;
      min-height: 44px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
      min-width: 0;
    }

    .button:hover {
      transform: translateY(-1px);
      background: var(--button-hover);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
    }

    .button:active { transform: translateY(1px); }
    .button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .button.is-primary {
      background: linear-gradient(135deg, rgba(120, 183, 255, 0.24), rgba(114, 203, 219, 0.22));
      border-color: rgba(144, 209, 235, 0.42);
    }

    .button--ghost {
      background: var(--button-ghost-bg);
    }

    .button--icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding-inline: 11px;
      white-space: nowrap;
    }

    .button__icon {
      font-size: 14px;
      line-height: 1;
    }

    .button__icon--svg svg,
    .detail-tag__icon svg {
      display: block;
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.85;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sidebar-actions .button__icon--svg svg {
      width: 20px;
      height: 20px;
      stroke-width: 1.9;
    }

    .dock-button__icon svg {
      display: block;
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .button__label {
      font-size: 12px;
      line-height: 1;
    }

    .control-panel-body {
      display: grid;
      gap: 12px;
    }


    .dock-button {
      display: none;
      width: 50px;
      height: 50px;
      padding: 0;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--dock-border);
      border-radius: 17px;
      color: var(--dock-icon);
      background: var(--dock-bg);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), var(--dock-shadow);
      cursor: pointer;
      transition: transform 140ms ease, border-color 140ms ease, background 140ms ease, box-shadow 140ms ease;
    }

    .dock-button:hover,
    .dock-button:focus-visible {
      transform: translateY(-1px) scale(1.02);
      border-color: rgba(155, 226, 240, 0.34);
      background: var(--dock-bg-hover);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 14px 24px rgba(0, 0, 0, 0.18);
    }

    .dock-button:focus-visible {
      outline: none;
    }

    .dock-button__icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      opacity: 0.96;
    }

    .sidebar-head [data-tooltip],
    .dock-button[data-tooltip] {
      position: relative;
    }

    .app.is-sidebar-collapsed .sidebar-head [data-tooltip]::after,
    .app.is-sidebar-collapsed .dock-button[data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      left: calc(100% + 12px);
      top: 50%;
      transform: translateY(-50%) translateX(-8px);
      padding: 7px 10px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      background: var(--panel-bg-strong);
      color: var(--text);
      font-size: 12px;
      line-height: 1;
      white-space: nowrap;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
      opacity: 0;
      pointer-events: none;
      transition: opacity 140ms ease, transform 140ms ease;
      z-index: 22;
    }

    .app.is-sidebar-collapsed .sidebar-head [data-tooltip]:hover::after,
    .app.is-sidebar-collapsed .sidebar-head [data-tooltip]:focus-visible::after,
    .app.is-sidebar-collapsed .dock-button[data-tooltip]:hover::after,
    .app.is-sidebar-collapsed .dock-button[data-tooltip]:focus-visible::after {
      opacity: 1;
      transform: translateY(-50%) translateX(0);
    }

    .filter-wrap,
    .progress-wrap {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .field-note {
      margin: 0;
      font-size: 11px;
      line-height: 1.5;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .field-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .filter-wrap label,
    .progress-wrap label {
      font-size: 12px;
      color: var(--text-soft);
      white-space: nowrap;
    }

    .filter-wrap select,
    .progress-wrap input {
      width: 100%;
      min-width: 0;
    }

    .progress-wrap span {
      font-size: 12px;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .filter-wrap select {
      min-height: 38px;
      border: 1px solid var(--input-border);
      border-radius: 12px;
      color: var(--text);
      background: var(--input-bg);
      padding: 8px 11px;
      outline: none;
    }

    .progress-wrap input[type="range"] {
      accent-color: var(--user);
    }

    .board {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: var(--board-bg);
      animation: gentleRise 480ms ease both;
      position: relative;
      z-index: 1;
    }

    .board-shell {
      position: relative;
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 368px;
    }

    .board-shell.is-detail-collapsed {
      grid-template-columns: minmax(0, 1fr);
    }

    .diagram-stage {
      min-width: 0;
      min-height: 0;
      display: flex;
      border-right: 1px solid var(--line-soft);
    }

    .board-shell.is-detail-collapsed .diagram-stage {
      border-right: none;
    }

    .diagram-scroll {
      position: relative;
      flex: 1;
      min-height: 100%;
      height: 100%;
      overflow: auto;
      scroll-behavior: smooth;
      scrollbar-gutter: stable both-edges;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
        linear-gradient(var(--grid-line-strong) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line-strong) 1px, transparent 1px);
      background-size: 32px 32px, 32px 32px, 160px 160px, 160px 160px;
      background-position: 0 0, 0 0, 0 0, 0 0;
    }

    .diagram-header {
      position: sticky;
      top: 0;
      z-index: 3;
      backdrop-filter: blur(3px);
      background: transparent;
      border-bottom: 1px solid var(--line-soft);
    }

    #diagram-header-svg {
      display: block;
      height: var(--header-h);
    }

    #diagram {
      display: block;
      min-width: 100%;
      height: auto;
    }

    .detail-panel {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 16px;
      padding: 18px 18px 16px;
      background:
        radial-gradient(circle at 12% 2%, rgba(118, 195, 243, 0.08), rgba(118, 195, 243, 0) 28%),
        linear-gradient(180deg, rgba(11, 25, 39, 0.92), rgba(8, 18, 29, 0.97));
      overflow: hidden;
    }

    .detail-panel.is-collapsed {
      display: none;
    }

    html[data-theme="light"] .detail-panel {
      background:
        radial-gradient(circle at 12% 2%, rgba(118, 195, 243, 0.12), rgba(118, 195, 243, 0) 28%),
        linear-gradient(180deg, rgba(247, 251, 255, 0.96), rgba(236, 243, 250, 0.98));
    }

    .detail-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
    }

    .detail-copy {
      flex-shrink: 0;
    }

    .detail-copy:disabled,
    .detail-clear:disabled {
      box-shadow: none;
    }

    .detail-copy:disabled:hover,
    .detail-clear:disabled:hover {
      transform: none;
    }

    .detail-head-main {
      min-width: 0;
      display: grid;
      gap: 6px;
    }

    .detail-kicker {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .detail-title {
      margin: 0;
      font-family: var(--font-ui);
      font-size: 23px;
      line-height: 1.18;
      color: var(--text);
      word-break: break-word;
      font-weight: 700;
    }

    .detail-subtitle {
      margin: 0;
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--text-soft);
    }

    .detail-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .detail-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-content: flex-start;
      min-width: 0;
      padding-bottom: 6px;
    }

    .detail-tag {
      display: inline-grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      max-width: 100%;
      min-height: 34px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--panel-border);
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-soft);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    html[data-theme="light"] .detail-tag {
      background: rgba(255, 255, 255, 0.72);
    }

    .detail-tag--accent {
      color: var(--text);
      border-color: var(--tag-accent, var(--panel-border));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .detail-tag__icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: currentColor;
      opacity: 0.94;
    }

    .detail-tag__text {
      min-width: 0;
      font-size: 12px;
      line-height: 1.4;
      white-space: normal;
      word-break: break-word;
    }

    .detail-content {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      padding: 20px 18px;
      border-radius: 22px;
      border: 1px solid var(--panel-border);
      background: linear-gradient(180deg, rgba(13, 30, 46, 0.72), rgba(7, 18, 29, 0.78));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      scrollbar-gutter: stable;
    }

    html[data-theme="light"] .detail-content {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(244, 249, 253, 0.96));
    }

    .detail-empty {
      margin: 0;
      font-size: 13px;
      line-height: 1.7;
      color: var(--text-soft);
    }

    .detail-body {
      margin: 0;
      display: grid;
      gap: 14px;
      font-family: var(--font-ui);
      font-size: 13px;
      line-height: 1.72;
      color: var(--text);
      word-break: break-word;
      user-select: text;
    }

    .detail-body > * {
      margin: 0;
    }

    .detail-body h1,
    .detail-body h2,
    .detail-body h3,
    .detail-body h4,
    .detail-body h5,
    .detail-body h6 {
      font-size: 1em;
      line-height: 1.45;
      font-weight: 700;
      color: var(--text);
    }

    .detail-body h1 { font-size: 1.42em; }
    .detail-body h2 { font-size: 1.3em; }
    .detail-body h3 { font-size: 1.18em; }

    .detail-body p {
      white-space: pre-wrap;
      color: var(--text);
    }

    .detail-body ul,
    .detail-body ol {
      display: grid;
      gap: 8px;
      padding-left: 1.3em;
      color: var(--text);
    }

    .detail-body li {
      white-space: pre-wrap;
    }

    .detail-body blockquote {
      padding: 12px 14px;
      border-left: 3px solid rgba(124, 196, 240, 0.52);
      border-radius: 0 16px 16px 0;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-soft);
      white-space: pre-wrap;
    }

    html[data-theme="light"] .detail-body blockquote {
      background: rgba(93, 142, 178, 0.08);
    }

    .detail-body hr {
      border: 0;
      height: 1px;
      background: var(--line-soft);
    }

    .detail-body a {
      color: var(--user);
      text-decoration: none;
      border-bottom: 1px solid rgba(120, 183, 255, 0.36);
    }

    .detail-body strong {
      font-weight: 700;
      color: var(--text);
    }

    .detail-body em {
      font-style: italic;
    }

    .detail-body code {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
      font-size: 0.92em;
      padding: 0.14em 0.42em;
      border-radius: 7px;
      background: rgba(118, 183, 255, 0.12);
      color: var(--text);
    }

    .detail-body pre {
      margin: 0;
      padding: 14px 15px;
      border-radius: 16px;
      border: 1px solid var(--panel-border);
      background: rgba(7, 18, 29, 0.58);
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    html[data-theme="light"] .detail-body pre {
      background: rgba(240, 246, 252, 0.9);
    }

    .detail-body pre code {
      display: block;
      padding: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
    }

    .detail-panel.is-empty .detail-tags,
    .detail-panel.is-empty .detail-body {
      display: none;
    }

    .detail-panel:not(.is-empty) .detail-empty {
      display: none;
    }

    .copy-toast {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 7;
      display: none;
      padding: 7px 11px;
      border: 1px solid var(--toast-border);
      border-radius: 999px;
      background: var(--toast-bg);
      color: var(--toast-text);
      font-size: 12px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
      white-space: nowrap;
    }

    .app.is-sidebar-collapsed .title-wrap,
    .app.is-sidebar-collapsed .live-state {
      display: none;
    }

    .app.is-sidebar-collapsed .sidebar {
      overflow: visible;
    }

    .app.is-sidebar-collapsed .sidebar-head {
      padding: 12px 8px 10px;
      gap: 12px;
      justify-items: center;
    }

    .app.is-sidebar-collapsed .sidebar-top {
      width: 100%;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
    }

    .app.is-sidebar-collapsed .sidebar-actions {
      width: auto;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
    }

    .app.is-sidebar-collapsed .brand-pill {
      width: 42px;
      min-width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 14px;
      letter-spacing: 0.04em;
    }

    .app.is-sidebar-collapsed .brand-pill__full {
      display: none;
    }

    .app.is-sidebar-collapsed .brand-pill__short {
      display: none;
    }

    .app.is-sidebar-collapsed .brand-mark {
      width: 20px;
      height: 20px;
    }

    .app.is-sidebar-collapsed .brand-mark svg {
      width: 20px;
      height: 20px;
    }

    .app.is-sidebar-collapsed .button--icon {
      width: 46px;
      min-width: 46px;
      min-height: 46px;
      padding: 0;
      border-radius: 15px;
    }

    .app.is-sidebar-collapsed .button__label {
      display: none;
    }

    .app.is-sidebar-collapsed .sidebar-toolbar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 12px 8px 14px;
      overflow: visible;
      scrollbar-gutter: auto;
    }

    .app.is-sidebar-collapsed .control-panel {
      width: 100%;
      padding: 0;
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      animation: none;
      position: relative;
      justify-items: center;
    }

    .app.is-sidebar-collapsed .control-panel-body {
      position: absolute;
      left: calc(100% - 6px);
      top: -6px;
      width: min(320px, calc(100vw - 128px));
      padding: 14px;
      border-radius: 18px;
      border: 1px solid var(--panel-border);
      background: var(--panel-bg-strong);
      box-shadow: 0 20px 38px rgba(0, 0, 0, 0.24);
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-8px) scale(0.98);
      transition: opacity 150ms ease, transform 150ms ease, visibility 150ms ease;
      z-index: 18;
    }

    .app.is-sidebar-collapsed .control-panel:hover .control-panel-body,
    .app.is-sidebar-collapsed .control-panel:focus-within .control-panel-body {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0) scale(1);
    }

    .app.is-sidebar-collapsed .dock-button {
      display: inline-flex;
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        height: calc(100vh - 28px);
        min-height: calc(100vh - 28px);
      }

      .board-shell {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr) minmax(228px, 38vh);
      }

      .board-shell.is-detail-collapsed {
        grid-template-rows: minmax(0, 1fr);
      }

      .diagram-stage {
        border-right: none;
        border-bottom: 1px solid var(--line-soft);
      }

      .board-shell.is-detail-collapsed .diagram-stage {
        border-bottom: none;
      }

      .detail-panel {
        padding: 16px 16px 14px;
      }

      .app.is-sidebar-collapsed {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }

      .sidebar {
        border-right: none;
        border-bottom: 1px solid var(--line-soft);
        max-height: min(42vh, 360px);
      }

      .app.is-sidebar-collapsed .sidebar {
        display: grid;
      }

      .app.is-sidebar-collapsed .title-wrap,
      .app.is-sidebar-collapsed .live-state {
        display: none;
      }

      .app.is-sidebar-collapsed .sidebar-head {
        padding: 12px 12px 10px;
      }

      .app.is-sidebar-collapsed .sidebar-top {
        flex-direction: row;
        justify-content: space-between;
      }

      .app.is-sidebar-collapsed .sidebar-actions {
        flex-direction: row;
      }

      .app.is-sidebar-collapsed .sidebar-toolbar {
        flex-direction: row;
        justify-content: flex-start;
        align-items: center;
        padding: 10px 12px 12px;
        overflow: auto;
      }

      .app.is-sidebar-collapsed .control-panel {
        width: auto;
      }

      .app.is-sidebar-collapsed .control-panel-body {
        left: 0;
        top: calc(100% + 10px);
        width: min(320px, calc(100vw - 28px));
      }
    }

    @media (max-width: 760px) {
      body { padding: 8px; }
      .app {
        min-height: calc(100vh - 16px);
        height: calc(100vh - 16px);
      }
      .sidebar {
        max-height: min(38vh, 332px);
      }
      .sidebar-head {
        padding: 12px 12px 10px;
        gap: 10px;
      }
      .title {
        font-size: clamp(20px, 6.4vw, 26px);
      }
      .subtitle {
        font-size: 11.5px;
        line-height: 1.42;
      }
      .sidebar-head,
      .sidebar-toolbar { padding-inline: 12px; }
      .sidebar-toolbar {
        padding-top: 10px;
        padding-bottom: 12px;
        gap: 10px;
      }
      .board-shell {
        grid-template-rows: minmax(0, 1fr) minmax(210px, 42vh);
      }
      .detail-panel {
        padding: 14px 12px 12px;
        gap: 14px;
      }
      .detail-head {
        flex-direction: column;
        align-items: stretch;
      }
      .detail-actions {
        justify-content: flex-start;
      }
      .detail-title {
        font-size: 21px;
      }
      .detail-content {
        padding: 18px 14px;
        border-radius: 18px;
      }
      .control-panel {
        padding: 12px;
        gap: 10px;
      }
      .control-panel-title {
        letter-spacing: 0.12em;
      }
      .live-state {
        padding: 5px 10px;
      }
      .button--icon {
        min-height: 38px;
      }
      .button__label {
        font-size: 11px;
      }
      .button-grid { grid-template-columns: 1fr; }
      .button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app" id="app-shell">
    <aside class="sidebar">
      <section class="sidebar-head">
        <div class="sidebar-top">
          <span class="brand-pill" data-tooltip="OpenClaw">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <ellipse class="brand-mark__glow" cx="12" cy="12" rx="10.5" ry="10"></ellipse>
                <path class="brand-mark__shell-dark" d="M11.8 6.2c-1.7 0-3.2 1-3.8 2.5-.7-.5-1.5-.8-2.4-.8-1.5 0-2.8.8-3.6 2l2 1.2c.4-.7 1.1-1.1 1.8-1.1.8 0 1.6.5 1.9 1.3l.3.8-.9.3c-1.2.4-2 1.5-2 2.7 0 1.7 1.4 3.1 3.1 3.1h7.7c2.3 0 4.2-1.8 4.2-4.1 0-1.9-1.4-3.6-3.2-4-.5-2.2-2.4-3.9-4.9-3.9z"></path>
                <path class="brand-mark__shell" d="M12.1 7.1c-1.5 0-2.8 1-3.3 2.4l-.3.8-.8-.4c-.6-.3-1.2-.5-1.8-.5-1 0-2 .4-2.7 1.2l1 .6c.5-.4 1.1-.7 1.7-.7.9 0 1.8.5 2.2 1.4l.5 1 1-.4c.5-.2 1-.3 1.5-.3 1.8 0 3.2 1.4 3.2 3.1 0 .6-.2 1.2-.5 1.7h2.4c1.7 0 3.1-1.3 3.1-3 0-1.5-1.1-2.7-2.5-3l-.8-.2-.1-.8c-.3-1.7-1.8-2.9-3.6-2.9z"></path>
                <circle class="brand-mark__accent" cx="9.5" cy="13.4" r="1"></circle>
                <circle class="brand-mark__accent" cx="13" cy="13.4" r="1"></circle>
                <path class="brand-mark__accent" d="M11.1 15.6c.5.4 1.3.4 1.8 0l.5.6c-.8.8-2 .8-2.8 0z"></path>
                <path class="brand-mark__accent" d="M18.9 7.1l1.6-1.2.7.9-1.8 1.4z"></path>
                <path class="brand-mark__accent" d="M19.3 9.4l2-.4.2 1.1-2.1.4z"></path>
                <path class="brand-mark__accent" d="M5.1 7.1 3.5 5.9l-.7.9 1.8 1.4z"></path>
                <path class="brand-mark__accent" d="M4.7 9.4 2.7 9l-.2 1.1 2.1.4z"></path>
              </svg>
            </span>
            <span class="brand-pill__full">OpenClaw</span>
            <span class="brand-pill__short">OC</span>
          </span>
          <div class="sidebar-actions">
            <button class="button button--ghost button--icon" id="toggle-theme" type="button" data-tooltip="切到浅色" aria-label="切到浅色">
              <span class="button__icon button__icon--svg" id="toggle-theme-icon" aria-hidden="true"></span>
              <span class="button__label" id="toggle-theme-label">切到浅色</span>
            </button>
            <button class="button button--ghost button--icon" id="toggle-sidebar" type="button" data-tooltip="收起边栏" aria-label="收起边栏">
              <span class="button__icon button__icon--svg" id="toggle-sidebar-icon" aria-hidden="true"></span>
              <span class="button__label" id="toggle-sidebar-label">收起边栏</span>
            </button>
          </div>
        </div>
        <div class="title-wrap">
          <h1 class="title">OpenClaw 执行时序图</h1>
          <p class="subtitle">自动读取历史 session，动态渲染 人 / main / 子agent 的交互流程</p>
        </div>
        <span class="live-state" id="live-state" data-state="connecting">连接中</span>
      </section>

      <section class="sidebar-toolbar">
        <div class="control-panel">
          <button class="dock-button" type="button" data-tooltip="回放控制" aria-label="回放控制">
            <span class="dock-button__icon" aria-hidden="true">
              <svg viewBox="0 0 20 20">
                <circle cx="7" cy="10" r="3"></circle>
                <path d="M6 8.4 8.7 10 6 11.6z"></path>
                <path d="M12.4 6.4h2.8"></path>
                <path d="M12.4 10h2.8"></path>
                <path d="M12.4 13.6h2"></path>
              </svg>
            </span>
          </button>
          <div class="control-panel-body">
            <div class="control-panel-head">
              <span class="control-panel-title">回放控制</span>
            </div>
            <div class="button-grid">
              <button class="button" id="prev-step">上一步</button>
              <button class="button" id="next-step">下一步</button>
            </div>
            <div class="progress-wrap">
              <div class="field-head">
                <label for="progress">进度</label>
                <span id="progress-text">0 / 0</span>
              </div>
              <input id="progress" type="range" min="0" max="0" value="0" step="1" />
            </div>
          </div>
        </div>

        <div class="control-panel">
          <button class="dock-button" type="button" data-tooltip="筛选" aria-label="筛选">
            <span class="dock-button__icon" aria-hidden="true">
              <svg viewBox="0 0 20 20">
                <path d="M4.7 5.2h10.6l-4.2 4.8v3.5l-2.2 1.3V10z"></path>
                <path d="M8.2 5.2v2"></path>
              </svg>
            </span>
          </button>
          <div class="control-panel-body">
            <div class="control-panel-head">
              <span class="control-panel-title">筛选</span>
            </div>
            <div class="filter-wrap">
              <div class="field-head">
                <label for="session-filter">会话筛选</label>
              </div>
              <select id="session-filter">
                <option value="all">全部会话</option>
              </select>
            </div>
            <div class="progress-wrap">
              <div class="field-head">
                <label for="time-start">时间范围</label>
                <span id="time-filter-text">00:00 - 24:00</span>
              </div>
              <div class="progress-wrap">
                <div class="field-head">
                  <label for="time-start">开始</label>
                  <span id="time-start-text">00:00</span>
                </div>
                <input id="time-start" type="range" min="0" max="23" value="0" step="1" />
              </div>
              <div class="progress-wrap">
                <div class="field-head">
                  <label for="time-end">结束</label>
                  <span id="time-end-text">24:00</span>
                </div>
                <input id="time-end" type="range" min="1" max="24" value="24" step="1" />
              </div>
              <p class="field-note" id="time-filter-note">按本地绝对时间筛选，范围覆盖 00:00 - 24:00。</p>
            </div>
          </div>
        </div>

        <div class="control-panel">
          <button class="dock-button" type="button" data-tooltip="思考信息" aria-label="思考信息">
            <span class="dock-button__icon" aria-hidden="true">
              <svg viewBox="0 0 20 20">
                <path d="M10 4.7a4.3 4.3 0 0 0-2.9 7.4c.7.5 1.1 1.2 1.3 2h3.2c.2-.8.6-1.5 1.3-2A4.3 4.3 0 0 0 10 4.7z"></path>
                <path d="M8.7 15h2.6"></path>
                <path d="M8.9 16.8h2.2"></path>
                <path d="M10 3.3v1"></path>
              </svg>
            </span>
          </button>
          <div class="control-panel-body">
            <div class="control-panel-head">
              <span class="control-panel-title">思考信息</span>
            </div>
            <div class="button-grid button-grid--single">
              <button class="button" id="toggle-thinking">展开思考信息</button>
            </div>
          </div>
        </div>

        <div class="control-panel">
          <button class="dock-button" type="button" data-tooltip="重载历史" aria-label="重载历史">
            <span class="dock-button__icon" aria-hidden="true">
              <svg viewBox="0 0 20 20">
                <path d="M15.1 8.3a5.4 5.4 0 1 0 .2 3.7"></path>
                <path d="M15 5.3v4.1h-4.1"></path>
              </svg>
            </span>
          </button>
          <div class="control-panel-body">
            <div class="control-panel-head">
              <span class="control-panel-title">重载历史</span>
            </div>
            <div class="button-grid button-grid--single">
              <button class="button" id="reload">重载历史</button>
            </div>
          </div>
        </div>

        <div class="control-panel">
          <button class="dock-button" type="button" data-tooltip="导出 HTML" aria-label="导出 HTML">
            <span class="dock-button__icon" aria-hidden="true">
              <svg viewBox="0 0 20 20">
                <path d="M6.3 4.8h5.1l2.7 2.7v7.7a1.6 1.6 0 0 1-1.6 1.6H6.3a1.6 1.6 0 0 1-1.6-1.6V6.4a1.6 1.6 0 0 1 1.6-1.6z"></path>
                <path d="M11.4 4.8v2.9h2.9"></path>
                <path d="M8 11h4"></path>
                <path d="M10 8.8v4.2"></path>
                <path d="M8.5 11.6 10 13.1l1.5-1.5"></path>
              </svg>
            </span>
          </button>
          <div class="control-panel-body">
            <div class="control-panel-head">
              <span class="control-panel-title">导出 HTML</span>
            </div>
            <div class="button-grid button-grid--single">
              <button class="button" id="export-html">导出 HTML</button>
            </div>
          </div>
        </div>
      </section>
    </aside>

    <main class="board">
      <div class="board-shell is-detail-collapsed" id="board-shell">
        <section class="diagram-stage">
          <div class="diagram-scroll" id="diagram-scroll">
            <div class="diagram-header" id="diagram-header">
              <svg id="diagram-header-svg" aria-hidden="true"></svg>
            </div>

      function readStorage(key) {
        try {
          return localStorage.getItem(key);
        } catch {

        }
      }

      function writeStorage(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch {
          // Ignore storage failures.
        }
      }

      function normalizeTheme(theme) {
        return theme === "light" ? "light" : "dark";
      }

      function applyTheme(theme) {
        state.theme = normalizeTheme(theme);
        document.documentElement.dataset.theme = state.theme;
      }

        appShell.classList.toggle("is-sidebar-collapsed", Boolean(state.sidebarCollapsed));

          render({ preserveScroll: true });
        }, 220);

      function cssVar(name, fallback) {

        return value || fallback;
      }

          rowAlt: cssVar("--svg-row-alt", "rgba(120, 208, 230, 0.03)"),

      function getIconSpec(name) {
        return SVG_ICON_SET[name] || SVG_ICON_SET.process;
      }

      function appendSvgIcon(target, name, options = {}) {
        const spec = getIconSpec(name);
        const {
          x = 0,
          y = 0,
          size = 14,
          color = "currentColor",
          strokeWidth = 1.8,
          opacity = 1
        } = options;

        const group = document.createElementNS(NS, "g");
        group.setAttribute("transform", `translate(${x} ${y}) scale(${size / 20})`);
        group.setAttribute("fill", "none");
        group.setAttribute("stroke", color);
        group.setAttribute("stroke-width", String(strokeWidth));
        group.setAttribute("stroke-linecap", "round");
        group.setAttribute("stroke-linejoin", "round");
        group.setAttribute("opacity", String(opacity));
        group.setAttribute("pointer-events", "none");

        (spec.paths || []).forEach((d) => {
          const path = document.createElementNS(NS, "path");
          path.setAttribute("d", d);
          group.appendChild(path);
        });

        (spec.circles || []).forEach((circleDef) => {
          const circle = document.createElementNS(NS, "circle");
          circle.setAttribute("cx", String(circleDef.cx));
          circle.setAttribute("cy", String(circleDef.cy));
          circle.setAttribute("r", String(circleDef.r));
          group.appendChild(circle);
        });

        (spec.rects || []).forEach((rectDef) => {
          const rect = document.createElementNS(NS, "rect");
          rect.setAttribute("x", String(rectDef.x));
          rect.setAttribute("y", String(rectDef.y));
          rect.setAttribute("width", String(rectDef.width));
          rect.setAttribute("height", String(rectDef.height));
          rect.setAttribute("rx", String(rectDef.rx || 0));
          group.appendChild(rect);
        });

        target.appendChild(group);
        return group;
      }

      function createHtmlIcon(name, options = {}) {
        const spec = getIconSpec(name);
        const {
          size = 14,
          color = "currentColor",
          strokeWidth = 1.85
        } = options;

        const svg = document.createElementNS(NS, "svg");
        svg.setAttribute("viewBox", "0 0 20 20");
        svg.setAttribute("width", String(size));
        svg.setAttribute("height", String(size));
        svg.setAttribute("fill", "none");
        svg.setAttribute("stroke", color);
        svg.setAttribute("stroke-width", String(strokeWidth));
        svg.setAttribute("stroke-linecap", "round");
        svg.setAttribute("stroke-linejoin", "round");
        svg.setAttribute("aria-hidden", "true");

        (spec.paths || []).forEach((d) => {
          const path = document.createElementNS(NS, "path");
          path.setAttribute("d", d);
          svg.appendChild(path);
        });

        (spec.circles || []).forEach((circleDef) => {
          const circle = document.createElementNS(NS, "circle");
          circle.setAttribute("cx", String(circleDef.cx));
          circle.setAttribute("cy", String(circleDef.cy));
          circle.setAttribute("r", String(circleDef.r));
          svg.appendChild(circle);
        });

        (spec.rects || []).forEach((rectDef) => {
          const rect = document.createElementNS(NS, "rect");
          rect.setAttribute("x", String(rectDef.x));
          rect.setAttribute("y", String(rectDef.y));
          rect.setAttribute("width", String(rectDef.width));
          rect.setAttribute("height", String(rectDef.height));
          rect.setAttribute("rx", String(rectDef.rx || 0));
          svg.appendChild(rect);
        });

        return svg;

      applyTheme(readStorage(THEME_STORAGE_KEY));

      function setLiveState(kind, text) {

      function safeMode(mode) {
        return ["user", "spawn", "a2a", "internal"].includes(mode) ? mode : "a2a";
      }

      function agentEmoji(id) {
        const clean = typeof id === "string" ? id.trim() : "";
        if (!clean) return "❔";
        if (clean === "user") return "🧑";
        if (clean === "main") return "🧠";
        if (/watch|monitor|guard|vigil/i.test(clean)) return "👀";
        if (/news|search|research|web/i.test(clean)) return "📰";
        if (/meal|food|cook/i.test(clean)) return "🍱";
        if (/cat/i.test(clean)) return "🐱";
        if (/trash|clean/i.test(clean)) return "🗑️";
        if (/wali|shield/i.test(clean)) return "🛡️";
        if (/eve/i.test(clean)) return "✨";
        return "🤖";
      }

      function extractSessionTag(raw, id) {
        if (raw && raw.meta && typeof raw.meta.sessionRef === "string" && raw.meta.sessionRef.trim()) {
          return raw.meta.sessionRef.trim();
        }
        if (!id || typeof id !== "string") return "";
        const idx = id.indexOf(":");
        if (idx <= 0) return "";
        return id.slice(0, idx);
      }

      function parseAgentFromSessionTag(sessionTag) {
        if (!sessionTag || typeof sessionTag !== "string") return "";
        const match = /^agent:([^:]+):/.exec(sessionTag.trim());
        return match ? match[1] : "";
      }

      function normalizeEvent(raw) {
        if (!raw || typeof raw !== "object") return null;
        if (typeof raw.from !== "string" || typeof raw.to !== "string") return null;

        const mode = safeMode(raw.mode);
        const meta = raw.meta && typeof raw.meta === "object" ? raw.meta : {};
        const text = typeof raw.text === "string" && raw.text.trim() ? raw.text.trim() : "(空消息)";
        const ts = Number(raw.ts) || Date.now();
        const id = String(raw.id || `${raw.seq || ""}-${ts}-${Math.random().toString(36).slice(2)}`);
        const mechanism =
          typeof meta.tool === "string" && meta.tool.trim()
            ? meta.tool.trim()
            : mode === "spawn"
              ? "sessions_spawn"
              : mode === "a2a"
                ? "sessions_send"
                : mode === "internal"
                  ? (typeof meta.module === "string" && meta.module.trim() ? meta.module.trim() : "process")
                  : "user_message";
        const stage = typeof meta.stage === "string" ? meta.stage.trim() : "";

        return {
          id,
          ts,
          mode,
          from: raw.from,
          to: raw.to,
          text,
          sessionTag: extractSessionTag(raw, id),
          sessionAgent:
            typeof raw.sessionAgent === "string" && raw.sessionAgent.trim()
              ? raw.sessionAgent.trim()
              : typeof meta.sessionAgent === "string" && meta.sessionAgent.trim()
                ? meta.sessionAgent.trim()
                : "",
          mechanism,
          stage
        };
      }

      function displayAgent(id) {
        const clean = typeof id === "string" ? id.trim() : "";
        if (!clean) return "❔ unknown";
        if (clean === "user") return "🧑 人";
        return `${agentEmoji(clean)} ${clean}`;
      }

      function internalModeLabel(evt) {
        const mechanism = typeof evt?.mechanism === "string" ? evt.mechanism.trim().toLowerCase() : "";
        if (evt?.stage === "thinking" || mechanism.includes("thinking")) return "THINKING";
        if (mechanism.includes("exec") || mechanism.includes("shell") || mechanism.includes("bash") || mechanism.includes("terminal")) return "EXEC";
        if (mechanism.includes("read")) return "READ";
        if (mechanism.includes("write") || mechanism.includes("edit")) return "WRITE";
        if (mechanism.includes("grep") || mechanism.includes("search")) return "SEARCH";
        if (mechanism.includes("fetch") || mechanism.includes("browser") || mechanism.includes("web")) return "FETCH";
        if (mechanism.includes("cron") || mechanism.includes("schedule")) return "SCHEDULE";
        if (mechanism.includes("message")) return "MESSAGE";
        if (!mechanism) return "PROCESS";
        return mechanism.replace(/^sessions_/, "").replace(/[_-]+/g, " ").trim().toUpperCase();
      }

      function modeSpec(evt) {
        const mode = typeof evt === "string" ? evt : evt?.mode;
        if (mode === "spawn") {
          return {
            shortLabel: "SPAWN",
            titleLabel: "SPAWN",
            description: "通过 sessions_spawn 新开子会话并分配任务"
          };
        }
        if (mode === "user") {
          return {
            shortLabel: "USER",
            titleLabel: "USER",
            description: "人和主智能体之间的输入或回复"
          };
        }
        if (mode === "internal") {
          const label = internalModeLabel(evt);
          const mechanism = detailMechanismLabel(evt) || label.toLowerCase();
          return {
            shortLabel: label,
            titleLabel: label,
            description: `内部过程，当前为 ${mechanism}`
          };
        }
        return {
          shortLabel: "SEND",
          titleLabel: "SEND",
          description: "通过 sessions_send 向已有会话发送消息"
        };
      }

      function modeName(evt) {
        return modeSpec(evt).shortLabel;
